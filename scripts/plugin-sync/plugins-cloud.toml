# Optional cloud desktop source, selected only by explicit request.
# Fleet desktops normally use plugin-exclusions.toml; web installs are separate.
[plugins."dots@dots"]
enabled = false

[plugins."drafts@dots"]
enabled = false

[plugins."dots@created-by-me-remote"]
enabled = true

[plugins."drafts@created-by-me-remote"]
enabled = true

# Keep the installed Canvas Sync app; its development checkout repeats skills.
[plugins."canvas@canvas-local"]
enabled = false

# Retired standalone package; preserve the branded app-backed Prosper plugin.
[plugins."prosper-finance@created-by-me-remote"]
enabled = false

# Design is local-source only until its first cloud publication.
# Keep local copies off on cloud profiles without requiring a nonexistent release.
[plugins."design@dots"]
enabled = false

[plugins."design@created-by-me-remote"]
enabled = false

# REA needs a local process in either account profile.
[plugins."rea@dots"]
enabled = true

# Superseded standalone REA installation; Fleet owns the active runtime.
[plugins."rea@rea-local"]
enabled = false
