# Fleet desktops: use local installs and keep cloud copies available on the web.
# Retired local identities can remain cached while older chats are using them.
[plugins."dots@dots"]
enabled = false

[plugins."drafts@dots"]
enabled = false

[plugins."design@dots"]
enabled = false

[plugins."rea@dots"]
enabled = false

[plugins."pstack@pstack"]
enabled = true

[plugins."drafts@pstack"]
enabled = true

[plugins."pstack@created-by-me-remote"]
enabled = false

# Preserve the exclusion while the existing cloud identity is renamed.
[plugins."dots@created-by-me-remote"]
enabled = false

[plugins."drafts@created-by-me-remote"]
enabled = false

# Keep the installed Canvas Sync app; its development checkout repeats skills.
[plugins."canvas@canvas-local"]
enabled = false

# Retired standalone package; preserve the branded app-backed Prosper plugin.
[plugins."prosper-finance@created-by-me-remote"]
enabled = false

# Design follows the selected profile source; cloud publication is separate.
[plugins."design@pstack"]
enabled = true

[plugins."design@created-by-me-remote"]
enabled = false

# REA needs a local process in either account profile.
[plugins."rea@pstack"]
enabled = true

# Superseded standalone REA installation; Fleet owns the active runtime.
[plugins."rea@rea-local"]
enabled = false
