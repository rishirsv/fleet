<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Atlas</title>
<style>
:root {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --text: #18181b;
  --text-2: #52525b;
  --text-3: #6b6b74;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: #eef2ff;
  --on-accent: #ffffff;
  --success: #15803d;
  --danger: #b91c1c;
  --inverse: #18181b;
  --on-inverse: #fafafa;
  --ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
  --shadow-sm: 0 1px 2px rgba(16, 16, 24, .05);
  --shadow-lg: 0 24px 60px -16px rgba(16, 16, 24, .35), 0 0 0 1px rgba(16, 16, 24, .06);
  --radius: 12px;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.4, 0, 1, 1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e;
    --surface: #151518;
    --surface-2: #1d1d21;
    --border: #2a2a2f;
    --border-strong: #3f3f46;
    --text: #f4f4f5;
    --text-2: #b4b4bc;
    --text-3: #8e8e98;
    --accent: #8b93ff;
    --accent-hover: #a5abff;
    --accent-soft: rgba(139, 147, 255, .12);
    --on-accent: #0c0c0e;
    --success: #4ade80;
    --danger: #f87171;
    --inverse: #f4f4f5;
    --on-inverse: #18181b;
    --shadow-lg: 0 24px 60px -16px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .06);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: none; box-shadow: var(--ring); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px;
  border: 1px solid var(--border-strong); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font-weight: 500; white-space: nowrap; cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: background-color .15s, border-color .15s, color .15s, transform .1s var(--ease-out), opacity .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active:not([aria-disabled="true"]) { transform: scale(.97); }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover { background: var(--surface); }
.btn-primary[aria-disabled="true"]:hover { background: var(--accent); }
.btn-primary.is-done[aria-disabled="true"] { opacity: 1; background: var(--success); color: var(--on-accent); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* Labels that swap in place without changing the button's width */
.swap { display: inline-grid; }
.swap > .swap-item {
  grid-area: 1 / 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  opacity: 0; transform: translateY(5px); visibility: hidden;
  transition: opacity .16s, transform .2s var(--ease-out), visibility 0s .16s;
}
.swap > .swap-item.on {
  opacity: 1; transform: none; visibility: visible;
  transition: opacity .16s, transform .2s var(--ease-out), visibility 0s;
}

.spinner {
  width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

kbd, .kbd {
  font: 500 11px/1 ui-sans-serif, system-ui, sans-serif;
  padding: 3px 5px; border-radius: 5px;
  border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-2);
}
.btn-primary kbd { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.28); color: inherit; }

/* Tooltip */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 8px); left: 50%;
  translate: -50% 4px;
  padding: 6px 9px; border-radius: 6px;
  background: var(--inverse); color: var(--on-inverse);
  font-size: 12px; font-weight: 500; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .15s, translate .15s var(--ease-out);
  z-index: 5;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; translate: -50% 0; transition-delay: .25s; }
[data-tip]:focus-visible::after { transition-delay: 0s; }

/* ---------- Header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  height: 56px; padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; }
.brand-mark {
  width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent), #a855f7);
  display: grid; place-items: center; color: #fff;
}
.brand-mark svg { width: 14px; height: 14px; }
.search-btn {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
  width: min(300px, 45vw); height: 34px; padding: 0 8px 0 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text-3); cursor: pointer;
  transition: border-color .15s, color .15s;
}
.search-btn:hover { border-color: var(--border-strong); color: var(--text-2); }
.search-btn svg { width: 15px; height: 15px; }
.search-btn kbd { margin-left: auto; }
.me {
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 600;
  background: var(--accent-soft); color: var(--accent);
}

/* ---------- Page ---------- */
main { max-width: 960px; margin: 0 auto; padding: 28px 24px 96px; }

/* Welcome */
.welcome-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s var(--ease-out), opacity .25s, margin .35s var(--ease-out); margin-bottom: 28px; }
.welcome-wrap.closing { grid-template-rows: 0fr; opacity: 0; margin-bottom: 0; }
.welcome-wrap > div { min-height: 0; overflow: hidden; }
.welcome {
  position: relative; overflow: hidden;
  padding: 24px 28px; border-radius: var(--radius);
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, #a855f7 16%, transparent), transparent 55%),
    linear-gradient(180deg, var(--accent-soft), var(--surface));
}
.welcome h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.015em; }
.welcome p { margin: 0 0 18px; color: var(--text-2); }
.welcome .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.welcome-in .welcome { animation: welcomeIn .6s var(--ease-out) .12s both; }
.welcome-in .welcome > * { animation: rise .5s var(--ease-out) both; }
.welcome-in .welcome > :nth-child(1) { animation-delay: .22s; }
.welcome-in .welcome > :nth-child(2) { animation-delay: .29s; }
.welcome-in .welcome > :nth-child(3) { animation-delay: .36s; }
@keyframes welcomeIn { from { opacity: 0; transform: translateY(10px) scale(.985); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.page-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
.toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.unsaved {
  display: inline-flex; align-items: center; gap: 7px;
  margin-right: 4px; color: var(--text-2); font-size: 13px;
  opacity: 0; transform: translateX(6px);
  transition: opacity .2s, transform .25s var(--ease-out);
}
.unsaved.on { opacity: 1; transform: none; }
.unsaved::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }

/* Card + list */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--border);
}
.count { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }

.segmented {
  position: relative; display: inline-flex; padding: 3px;
  background: var(--surface-2); border-radius: 8px; border: 1px solid var(--border);
}
.segmented button {
  position: relative; z-index: 1;
  height: 26px; padding: 0 12px; border: 0; border-radius: 6px;
  background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: color .15s;
}
.segmented button:hover { color: var(--text); }
.segmented button[aria-checked="true"] { color: var(--text); }
.segmented .thumb {
  position: absolute; top: 3px; left: 0; height: 26px; width: var(--w, 0);
  transform: translateX(var(--x, 0));
  background: var(--surface); border-radius: 6px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--border);
}
.segmented.ready .thumb { transition: transform .28s var(--ease-out), width .28s var(--ease-out); }

.list { list-style: none; margin: 0 0 -1px; padding: 0; }
.row { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .32s var(--ease-out), opacity .22s; }
.row.archived { grid-template-rows: 0fr; opacity: 0; }
.row-inner { min-height: 0; overflow: hidden; }
.row-content {
  display: grid; align-items: center; gap: 16px;
  grid-template-columns: minmax(0, 1fr) 190px 120px 84px;
  padding: 12px 12px 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: background-color .15s;
}
.row-content:hover { background: var(--surface-2); }
.row.entering .row-inner { animation: rise .4s var(--ease-out) backwards; animation-delay: calc(var(--i) * 35ms + 180ms); }
.name { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.owner { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text-2); }
.owner span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; font-size: 10.5px; font-weight: 650;
  background: hsl(var(--h) 75% 92%); color: hsl(var(--h) 55% 30%);
}
@media (prefers-color-scheme: dark) { .avatar { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 80% 82%); } }
.updated { color: var(--text-3); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.archive { justify-self: end; }

.empty { padding: 48px 16px; text-align: center; color: var(--text-2); animation: rise .35s var(--ease-out); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 12px; }

/* API key */
.section-title { margin: 36px 0 12px; font-size: 15px; letter-spacing: -.01em; }
.key-row { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; }
.key {
  flex: 1; min-width: 0;
  font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  padding: 8px 12px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.copy-btn.is-done { color: var(--success); border-color: color-mix(in srgb, var(--success) 40%, var(--border)); }

/* Toasts */
.toasts {
  position: fixed; left: 50%; bottom: 24px; z-index: 50;
  translate: -50% 0;
  display: flex; flex-direction: column-reverse; align-items: center; gap: 8px;
  width: max-content; max-width: calc(100vw - 32px);
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 14px;
  min-height: 42px; padding: 8px 8px 8px 14px; border-radius: 10px;
  background: var(--inverse); color: var(--on-inverse);
  box-shadow: var(--shadow-lg); font-size: 13.5px;
  animation: toastIn .32s var(--ease-out);
}
.toast.no-action { padding-right: 14px; }
.toast.out { animation: toastOut .2s var(--ease-in) forwards; }
.toast svg { width: 16px; height: 16px; flex: none; }
.toast .ok { color: #4ade80; }
@media (prefers-color-scheme: dark) { .toast .ok { color: var(--success); filter: brightness(.7); } }
.toast button {
  height: 28px; padding: 0 10px; border: 0; border-radius: 6px; cursor: pointer;
  background: color-mix(in srgb, var(--on-inverse) 14%, transparent); color: inherit; font-weight: 600; font-size: 13px;
}
.toast button:hover { background: color-mix(in srgb, var(--on-inverse) 22%, transparent); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.97); } }

/* Command palette */
.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 14vh 16px 16px;
  background: rgba(10, 10, 14, .38);
  opacity: 0; transition: opacity .16s;
}
.overlay.open { opacity: 1; }
.palette {
  width: min(560px, 100%);
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg);
  overflow: hidden;
  transform: translateY(-8px) scale(.97); opacity: 0;
  transition: transform .2s var(--ease-out), opacity .16s;
}
.overlay.open .palette { transform: none; opacity: 1; }
.palette-search { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.palette-search svg { width: 17px; height: 17px; color: var(--text-3); flex: none; }
.palette input {
  flex: 1; height: 52px; border: 0; outline: none; background: transparent;
  color: var(--text); font: inherit; font-size: 15px;
}
.palette input::placeholder { color: var(--text-3); }
.palette input:focus-visible { box-shadow: none; }
.results { max-height: min(360px, 52vh); overflow-y: auto; padding: 6px; scroll-padding: 6px; }
.group-label { padding: 10px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.option {
  display: flex; align-items: center; gap: 10px;
  height: 38px; padding: 0 10px; border-radius: 8px;
  color: var(--text); cursor: pointer;
}
.option[aria-selected="true"] { background: var(--accent-soft); }
.option svg { width: 16px; height: 16px; color: var(--text-3); flex: none; }
.option[aria-selected="true"] svg { color: var(--accent); }
.option .hint { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }
.no-results { padding: 28px 12px; text-align: center; color: var(--text-3); }
.palette-foot {
  display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid var(--border);
  color: var(--text-3); font-size: 12px;
}
.palette-foot span { display: inline-flex; align-items: center; gap: 5px; }

/* Responsive */
@media (max-width: 680px) {
  .topbar { padding: 0 16px; }
  .search-btn span { display: none; }
  .search-btn { width: auto; }
  main { padding: 20px 16px 96px; }
  .toolbar { margin-left: 0; width: 100%; }
  .unsaved { margin-right: auto; }
  .row-content {
    grid-template-columns: auto 1fr auto;
    grid-template-areas: "name name action" "owner updated action";
    row-gap: 4px; column-gap: 12px;
  }
  .name { grid-area: name; }
  .owner { grid-area: owner; }
  .updated { grid-area: updated; }
  .archive { grid-area: action; }
  .key-row { flex-wrap: wrap; }
  .key { flex-basis: 100%; }
  .palette-foot { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-delay: 0s !important;
    transition-duration: .01ms !important; transition-delay: 0s !important;
  }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M7 3v5h8M7 21v-7h10v7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
</svg>

<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 12 4l8 16M7.5 13h9"/></svg></span>
    Atlas
  </div>
  <button class="search-btn" id="searchBtn" type="button" aria-haspopup="dialog">
    <svg aria-hidden="true"><use href="#i-search"/></svg>
    <span>Search commands</span>
    <kbd class="mod-k">⌘K</kbd>
  </button>
  <div class="me" aria-label="Signed in as Jordan Lee" role="img">JL</div>
</header>

<main id="main">
  <div class="welcome-wrap welcome-in" id="welcomeWrap" hidden>
    <div>
      <section class="welcome" aria-labelledby="welcomeTitle">
        <h2 id="welcomeTitle">Welcome to Atlas</h2>
        <p>Every project, owner and update in one place. Press <span class="mod-k-text">⌘K</span> to jump to anything.</p>
        <div class="actions">
          <button class="btn btn-primary" id="welcomeOpen" type="button">Open command palette <kbd class="mod-k">⌘K</kbd></button>
          <button class="btn" id="welcomeDismiss" type="button">Dismiss</button>
        </div>
      </section>
    </div>
  </div>

  <div class="page-head">
    <h1>Projects</h1>
    <div class="toolbar" role="group" aria-label="Changes">
      <span class="unsaved" id="unsaved" aria-hidden="true"></span>
      <button class="btn" id="discardBtn" type="button" aria-disabled="true">Discard</button>
      <button class="btn btn-primary swap" id="saveBtn" type="button" aria-disabled="true">
        <span class="swap-item on" data-s="idle">Save</span>
        <span class="swap-item" data-s="busy"><span class="spinner" aria-hidden="true"></span>Saving</span>
        <span class="swap-item" data-s="done"><svg aria-hidden="true"><use href="#i-check"/></svg>Saved</span>
      </button>
      <button class="btn" id="publishBtn" type="button" aria-disabled="true" data-tip="Publishing isn't available yet" aria-describedby="publishTip">Publish</button>
      <span id="publishTip" class="sr-only">Publishing isn't available yet</span>
    </div>
  </div>

  <section class="card" aria-label="Project list">
    <div class="card-head">
      <span class="count" id="count"></span>
      <div class="segmented" id="sort" role="radiogroup" aria-label="Sort projects">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-sort="newest">Newest</button>
        <button type="button" role="radio" data-sort="oldest">Oldest</button>
        <button type="button" role="radio" data-sort="name">Name</button>
      </div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <strong>No active projects</strong>
      <button class="btn" id="emptyDiscard" type="button">Restore archived projects</button>
    </div>
  </section>

  <h2 class="section-title" id="apiTitle">API key</h2>
  <section class="card" aria-labelledby="apiTitle">
    <div class="key-row">
      <code class="key" id="keyText"></code>
      <button class="btn copy-btn swap" id="copyBtn" type="button" aria-label="Copy API key">
        <span class="swap-item on" data-s="idle"><svg aria-hidden="true"><use href="#i-copy"/></svg>Copy</span>
        <span class="swap-item" data-s="done"><svg aria-hidden="true"><use href="#i-check"/></svg>Copied</span>
      </button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" placeholder="Type a command or project…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="results" aria-autocomplete="list">
    </div>
    <div class="results" id="results" role="listbox" aria-label="Commands"></div>
    <div class="palette-foot" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> Move</span>
      <span><kbd>↵</kbd> Run</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="sr-only" id="announcer" aria-live="polite"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const isMac = /Mac|iPhone|iPad|iPod/i.test(navigator.userAgentData?.platform || navigator.platform || navigator.userAgent);
  const MOD = isMac ? '⌘' : 'Ctrl+';
  document.querySelectorAll('.mod-k').forEach((el) => (el.textContent = isMac ? '⌘K' : 'Ctrl K'));
  document.querySelectorAll('.mod-k-text').forEach((el) => (el.textContent = isMac ? '⌘K' : 'Ctrl+K'));
  $('#searchBtn').setAttribute('aria-keyshortcuts', isMac ? 'Meta+K' : 'Control+K');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- Data ----------
  const now = Date.now();
  const MIN = 6e4, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const projects = [
    { id: 'orion',   name: 'Orion Launch',              owner: 'Maya Chen',      updated: now - 12 * MIN },
    { id: 'billing', name: 'Billing Revamp',            owner: 'Daniel Okafor',  updated: now - 2 * HOUR - 20 * MIN },
    { id: 'mobile',  name: 'Mobile Onboarding',         owner: 'Priya Shah',     updated: now - 1 * DAY - 3 * HOUR },
    { id: 'dw',      name: 'Data Warehouse Migration',  owner: 'Lucas Moreau',   updated: now - 4 * DAY },
    { id: 'brand',   name: 'Q4 Brand Refresh',          owner: 'Sofia Álvarez',  updated: now - 16 * DAY },
    { id: 'support', name: 'Support Portal',            owner: 'Ken Watanabe',   updated: now - 41 * DAY },
  ];
  const API_KEY = 'atl_sk_live_4f9c2a7e81b3d60c5e7a9f12d6e1';

  const state = {
    sort: store.get('atlas.sort') || 'newest',
    pending: new Set(),   // archived, not yet saved
    saved: new Set(),     // archived and saved
    saving: false,
  };
  const byId = (id) => projects.find((p) => p.id === id);
  const isActive = (p) => !state.pending.has(p.id) && !state.saved.has(p.id);

  const announce = (msg) => {
    const el = $('#announcer');
    el.textContent = '';
    requestAnimationFrame(() => (el.textContent = msg));
  };
  const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

  // ---------- Time ----------
  const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
  const dtf = new Intl.DateTimeFormat('en', { dateStyle: 'medium', timeStyle: 'short' });
  function relTime(t) {
    const diff = Date.now() - t;
    if (diff < MIN) return 'Just now';
    if (diff < HOUR) return rtf.format(-Math.round(diff / MIN), 'minute');
    if (diff < DAY) return rtf.format(-Math.round(diff / HOUR), 'hour');
    if (diff < 7 * DAY) return capitalize(rtf.format(-Math.round(diff / DAY), 'day'));
    if (diff < 30 * DAY) return rtf.format(-Math.round(diff / (7 * DAY)), 'week');
    return rtf.format(-Math.round(diff / (30 * DAY)), 'month');
  }
  const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // ---------- List ----------
  const list = $('#list');
  const rows = new Map();
  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function buildRow(p, i) {
    const li = document.createElement('li');
    li.className = 'row entering';
    li.dataset.id = p.id;
    li.style.setProperty('--i', i);
    li.innerHTML = `
      <div class="row-inner">
        <div class="row-content">
          <span class="name">${esc(p.name)}</span>
          <span class="owner"><span class="avatar" style="--h:${hue(p.owner)}" aria-hidden="true">${initials(p.owner)}</span><span>${esc(p.owner)}</span></span>
          <time class="updated" datetime="${new Date(p.updated).toISOString()}" title="${dtf.format(p.updated)}">${relTime(p.updated)}</time>
          <button class="btn btn-ghost btn-sm archive" type="button" aria-label="Archive ${esc(p.name)}">
            <svg aria-hidden="true"><use href="#i-archive"/></svg>Archive
          </button>
        </div>
      </div>`;
    li.querySelector('.row-inner').addEventListener('animationend', () => li.classList.remove('entering'), { once: true });
    li.querySelector('.archive').addEventListener('click', () => archive(p.id));
    rows.set(p.id, li);
    return li;
  }

  const comparators = {
    newest: (a, b) => b.updated - a.updated,
    oldest: (a, b) => a.updated - b.updated,
    name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }),
  };
  const sorted = () => [...projects].sort(comparators[state.sort]);

  sorted().forEach((p, i) => list.appendChild(buildRow(p, i)));

  setInterval(() => {
    rows.forEach((li, id) => (li.querySelector('.updated').textContent = relTime(byId(id).updated)));
  }, 30e3);

  // ---------- Sort (segmented control + FLIP reorder) ----------
  const sortEl = $('#sort');
  const sortBtns = [...sortEl.querySelectorAll('[role=radio]')];
  const thumb = sortEl.querySelector('.thumb');
  const SORT_LABEL = { newest: 'newest', oldest: 'oldest', name: 'name' };

  function placeThumb() {
    const b = sortBtns.find((x) => x.dataset.sort === state.sort);
    thumb.style.setProperty('--x', b.offsetLeft + 'px');
    thumb.style.setProperty('--w', b.offsetWidth + 'px');
  }
  function syncSortControl() {
    sortBtns.forEach((b) => {
      const on = b.dataset.sort === state.sort;
      b.setAttribute('aria-checked', on);
      b.tabIndex = on ? 0 : -1;
    });
    placeThumb();
  }
  function setSort(key) {
    if (key === state.sort) return;
    state.sort = key;
    store.set('atlas.sort', key);
    syncSortControl();

    const els = [...list.children];
    const before = new Map(els.map((el) => [el, el.getBoundingClientRect().top]));
    sorted().forEach((p) => rows.has(p.id) && list.appendChild(rows.get(p.id)));
    if (!reduceMotion.matches) {
      els.forEach((el) => {
        const dy = before.get(el) - el.getBoundingClientRect().top;
        if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.2,.8,.2,1)' });
      });
    }
    announce(`Sorted by ${SORT_LABEL[key]}`);
  }
  sortBtns.forEach((b) => b.addEventListener('click', () => setSort(b.dataset.sort)));
  sortEl.addEventListener('keydown', (e) => {
    const i = sortBtns.findIndex((b) => b.dataset.sort === state.sort);
    let n = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = (i + 1) % sortBtns.length;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = (i - 1 + sortBtns.length) % sortBtns.length;
    if (n === null) return;
    e.preventDefault();
    setSort(sortBtns[n].dataset.sort);
    sortBtns[n].focus();
  });
  syncSortControl();
  requestAnimationFrame(() => requestAnimationFrame(() => sortEl.classList.add('ready')));
  addEventListener('resize', placeThumb);

  // ---------- Archive / restore ----------
  function visibleRows() {
    return [...list.children].filter((el) => !el.classList.contains('archived'));
  }
  function archive(id) {
    const p = byId(id), li = rows.get(id);
    if (!p || !isActive(p)) return;
    const vis = visibleRows();
    const idx = vis.indexOf(li);
    const hadFocus = li.contains(document.activeElement);

    state.pending.add(id);
    li.classList.add('archived');
    li.inert = true;

    if (hadFocus) {
      const next = vis[idx + 1] || vis[idx - 1];
      (next ? next.querySelector('.archive') : sortBtns.find((b) => b.tabIndex === 0)).focus();
    }
    refresh();
    toast(`Archived ${p.name}`, { action: { label: 'Undo', run: () => restore(id) }, tag: 'undo' });
  }
  function restore(id, { quiet = false } = {}) {
    if (!state.pending.has(id)) return;
    const li = rows.get(id);
    state.pending.delete(id);
    li.inert = false;
    li.classList.remove('archived');
    refresh();
    if (!quiet) toast(`Restored ${byId(id).name}`, { icon: 'check' });
  }

  // ---------- Save / discard ----------
  const saveBtn = $('#saveBtn'), discardBtn = $('#discardBtn'), unsaved = $('#unsaved');
  let unsavedTimer;

  function setSwap(btn, s) {
    btn.querySelectorAll('.swap-item').forEach((el) => el.classList.toggle('on', el.dataset.s === s));
  }
  function refresh() {
    const n = state.pending.size;
    const active = projects.filter(isActive).length;
    $('#count').textContent = plural(active, 'project');

    const dirty = n > 0 && !state.saving;
    discardBtn.setAttribute('aria-disabled', !dirty);
    if (!state.saving && !saveBtn.classList.contains('is-done')) saveBtn.setAttribute('aria-disabled', !dirty);

    clearTimeout(unsavedTimer);
    if (n) {
      unsaved.textContent = plural(n, 'unsaved change');
      unsaved.classList.add('on');
    } else {
      unsaved.classList.remove('on');
      unsavedTimer = setTimeout(() => !state.pending.size && (unsaved.textContent = ''), 250);
    }

    const empty = $('#empty');
    const wasHidden = empty.hidden;
    empty.hidden = active > 0;
    $('#emptyDiscard').hidden = n === 0;
    if (wasHidden && !empty.hidden) {
      empty.style.animation = 'none';
      void empty.offsetWidth;
      empty.style.animation = '';
    }
  }

  function save() {
    if (state.saving || !state.pending.size) return;
    state.saving = true;
    const ids = [...state.pending];
    saveBtn.setAttribute('aria-disabled', 'true');
    setSwap(saveBtn, 'busy');
    refresh();
    dismissToasts('undo');

    setTimeout(() => {
      ids.forEach((id) => {
        state.pending.delete(id);
        state.saved.add(id);
        rows.get(id).remove();
        rows.delete(id);
      });
      state.saving = false;
      saveBtn.classList.add('is-done');
      setSwap(saveBtn, 'done');
      refresh();
      toast(ids.length === 1 ? `Saved. ${byId(ids[0]).name} is archived.` : `Saved. ${ids.length} projects archived.`, { icon: 'check' });
      setTimeout(() => {
        saveBtn.classList.remove('is-done');
        setSwap(saveBtn, 'idle');
        refresh();
      }, 1600);
    }, 700);
  }

  function discard() {
    if (state.saving || !state.pending.size) return;
    const n = state.pending.size;
    dismissToasts('undo');
    [...state.pending].forEach((id) => restore(id, { quiet: true }));
    toast(`Discarded ${plural(n, 'change')}`);
  }

  saveBtn.addEventListener('click', save);
  discardBtn.addEventListener('click', discard);
  $('#emptyDiscard').addEventListener('click', () => {
    discard();
    requestAnimationFrame(() => visibleRows()[0]?.querySelector('.archive').focus());
  });
  $('#publishBtn').addEventListener('click', (e) => e.preventDefault());
  addEventListener('beforeunload', (e) => {
    if (state.pending.size) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- API key ----------
  const copyBtn = $('#copyBtn');
  $('#keyText').textContent = API_KEY.slice(0, 12) + '•'.repeat(16) + API_KEY.slice(-4);
  let copyTimer;

  function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }
  async function copyKey({ fromPalette = false } = {}) {
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(API_KEY); ok = true; }
    } catch {}
    if (!ok) ok = legacyCopy(API_KEY);

    if (!ok) {
      toast("Couldn't copy. Check your browser's clipboard permissions.", { tone: 'error' });
      return;
    }
    clearTimeout(copyTimer);
    copyBtn.classList.add('is-done');
    setSwap(copyBtn, 'done');
    copyBtn.setAttribute('aria-label', 'API key copied');
    if (fromPalette) toast('API key copied', { icon: 'check' });
    else announce('API key copied');
    copyTimer = setTimeout(() => {
      copyBtn.classList.remove('is-done');
      setSwap(copyBtn, 'idle');
      copyBtn.setAttribute('aria-label', 'Copy API key');
    }, 1800);
  }
  copyBtn.addEventListener('click', () => copyKey());

  // ---------- Welcome ----------
  const welcomeWrap = $('#welcomeWrap');
  const isWelcomeHidden = () => welcomeWrap.hidden || welcomeWrap.classList.contains('closing');
  if (store.get('atlas.welcomeDismissed') !== '1') welcomeWrap.hidden = false;

  function dismissWelcome() {
    store.set('atlas.welcomeDismissed', '1');
    welcomeWrap.classList.add('closing');
    const done = () => { if (welcomeWrap.classList.contains('closing')) welcomeWrap.hidden = true; };
    setTimeout(done, reduceMotion.matches ? 0 : 360);
    $('h1').setAttribute('tabindex', '-1');
    if (welcomeWrap.contains(document.activeElement)) $('h1').focus({ preventScroll: true });
    toast('Welcome panel hidden', { action: { label: 'Undo', run: showWelcome } });
  }
  function showWelcome() {
    store.del('atlas.welcomeDismissed');
    welcomeWrap.classList.remove('welcome-in');
    welcomeWrap.hidden = false;
    welcomeWrap.classList.add('closing');
    void welcomeWrap.offsetHeight;
    welcomeWrap.classList.remove('closing');
    window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  }
  $('#welcomeDismiss').addEventListener('click', dismissWelcome);
  $('#welcomeOpen').addEventListener('click', () => openPalette());

  // ---------- Toasts ----------
  const toasts = $('#toasts');
  const ICONS = { check: '<svg class="ok" aria-hidden="true"><use href="#i-check"/></svg>' };

  function toast(message, { action, icon, tag, duration } = {}) {
    while (toasts.children.length >= 3) removeToast(toasts.firstElementChild, true);
    const el = document.createElement('div');
    el.className = 'toast' + (action ? '' : ' no-action');
    if (tag) el.dataset.tag = tag;
    el.innerHTML = `${icon ? ICONS[icon] : ''}<span>${esc(message)}</span>`;
    if (action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = action.label;
      b.addEventListener('click', () => { action.run(); removeToast(el); });
      el.appendChild(b);
    }
    toasts.appendChild(el);

    const ms = duration || (action ? 6000 : 3200);
    let remaining = ms, started = Date.now(), timer = setTimeout(() => removeToast(el), ms);
    const pause = () => { clearTimeout(timer); remaining -= Date.now() - started; };
    const resume = () => { started = Date.now(); timer = setTimeout(() => removeToast(el), Math.max(remaining, 1200)); };
    el.addEventListener('mouseenter', pause);
    el.addEventListener('mouseleave', resume);
    el.addEventListener('focusin', pause);
    el.addEventListener('focusout', resume);
    el._clear = () => clearTimeout(timer);
    return el;
  }
  function removeToast(el, instant = false) {
    if (!el || !el.isConnected || el.classList.contains('out')) { if (instant && el) el.remove(); return; }
    el._clear?.();
    if (instant || reduceMotion.matches) return el.remove();
    el.classList.add('out');
    el.addEventListener('animationend', () => el.remove(), { once: true });
    setTimeout(() => el.remove(), 300);
  }
  function dismissToasts(tag) {
    toasts.querySelectorAll(`[data-tag="${tag}"]`).forEach((el) => removeToast(el));
  }

  // ---------- Command palette ----------
  const overlay = $('#overlay'), input = $('#paletteInput'), results = $('#results');
  let paletteOpen = false, returnFocus = null, items = [], activeIndex = 0, closeTimer;

  const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
  function commands() {
    const c = [];
    if (state.pending.size && !state.saving) {
      c.push({ group: 'Changes', label: 'Save changes', icon: 'save', hint: `<kbd>${MOD}S</kbd>`, run: save });
      c.push({ group: 'Changes', label: 'Discard changes', icon: 'restore', run: discard });
    }
    c.push({ group: 'General', label: 'Copy API key', icon: 'copy', run: () => copyKey({ fromPalette: true }) });
    if (isWelcomeHidden()) c.push({ group: 'General', label: 'Show welcome panel', icon: 'spark', run: showWelcome });
    for (const k of ['newest', 'oldest', 'name']) {
      c.push({
        group: 'Sort', label: `Sort by ${SORT_LABEL[k]}`, icon: 'sort',
        hint: state.sort === k ? `${icon('check')}` : '', run: () => setSort(k),
      });
    }
    sorted().forEach((p) => {
      if (isActive(p)) c.push({ group: 'Projects', label: `Archive ${p.name}`, icon: 'archive', run: () => archive(p.id) });
      else if (state.pending.has(p.id)) c.push({ group: 'Projects', label: `Restore ${p.name}`, icon: 'restore', run: () => restore(p.id) });
    });
    return c;
  }

  function renderPalette() {
    const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    items = commands().filter((c) => {
      const hay = (c.label + ' ' + c.group).toLowerCase();
      return terms.every((t) => hay.includes(t));
    });
    activeIndex = Math.min(activeIndex, Math.max(items.length - 1, 0));

    if (!items.length) {
      results.innerHTML = `<div class="no-results">No commands match “${esc(input.value.trim())}”</div>`;
      input.removeAttribute('aria-activedescendant');
      return;
    }
    let html = '', group = null;
    items.forEach((c, i) => {
      if (c.group !== group) {
        if (group !== null) html += '</div>';
        group = c.group;
        html += `<div role="group" aria-labelledby="g-${i}"><div class="group-label" id="g-${i}">${c.group}</div>`;
      }
      html += `<div class="option" role="option" id="opt-${i}" data-i="${i}" aria-selected="${i === activeIndex}">${icon(c.icon)}<span>${esc(c.label)}</span>${c.hint ? `<span class="hint">${c.hint}</span>` : ''}</div>`;
    });
    results.innerHTML = html + '</div>';
    setActive(activeIndex, false);
  }

  function setActive(i, scroll = true) {
    if (!items.length) return;
    activeIndex = (i + items.length) % items.length;
    results.querySelectorAll('.option').forEach((el) => el.setAttribute('aria-selected', +el.dataset.i === activeIndex));
    const el = $('#opt-' + activeIndex);
    input.setAttribute('aria-activedescendant', el.id);
    if (scroll) el.scrollIntoView({ block: 'nearest' });
  }

  function runItem(i) {
    const c = items[i];
    if (!c) return;
    closePalette();
    c.run();
  }

  function openPalette() {
    if (paletteOpen) return;
    paletteOpen = true;
    clearTimeout(closeTimer);
    returnFocus = document.activeElement;
    input.value = '';
    activeIndex = 0;
    renderPalette();
    overlay.hidden = false;
    $('#main').inert = true;
    $('#topbar').inert = true;
    void overlay.offsetWidth;
    overlay.classList.add('open');
    input.focus();
  }
  function closePalette() {
    if (!paletteOpen) return;
    paletteOpen = false;
    overlay.classList.remove('open');
    $('#main').inert = false;
    $('#topbar').inert = false;
    closeTimer = setTimeout(() => (overlay.hidden = true), reduceMotion.matches ? 0 : 180);
    if (returnFocus && returnFocus.isConnected && returnFocus !== document.body) returnFocus.focus({ preventScroll: true });
  }

  input.addEventListener('input', () => { activeIndex = 0; renderPalette(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIndex + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIndex - 1); }
    else if (e.key === 'Home' && !input.value) { e.preventDefault(); setActive(0); }
    else if (e.key === 'End' && !input.value) { e.preventDefault(); setActive(items.length - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); runItem(activeIndex); }
    else if (e.key === 'Tab') { e.preventDefault(); }
  });
  results.addEventListener('mousedown', (e) => e.preventDefault());
  results.addEventListener('mousemove', (e) => {
    const o = e.target.closest('.option');
    if (o && +o.dataset.i !== activeIndex) setActive(+o.dataset.i, false);
  });
  results.addEventListener('click', (e) => {
    const o = e.target.closest('.option');
    if (o) runItem(+o.dataset.i);
  });
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closePalette(); });
  $('#searchBtn').addEventListener('click', openPalette);

  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    const key = e.key.toLowerCase();
    if (mod && key === 'k') {
      e.preventDefault();
      paletteOpen ? closePalette() : openPalette();
      return;
    }
    if (paletteOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
      return;
    }
    if (mod && key === 's') { e.preventDefault(); save(); }
  });

  refresh();
})();
</script>
</body>
</html>
