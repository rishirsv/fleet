<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4EF">
<title>Vehicles – Relay</title>
<style>
:root {
  color-scheme: light;
  /* surfaces, tinted from the sign green */
  --paper: #F2F4EF;
  --board: #E5EAE3;
  --surface: #FCFDFB;
  --hover: #EDF1EB;
  --open: #DFE8E1;
  /* text */
  --ink: #16231E;
  --ink-2: #48574F;
  --ink-3: #66756D;
  /* lines */
  --line: #D2DAD2;
  --line-soft: #E3E8E2;
  /* accent: primary action only */
  --accent: #0B6B4C;
  --accent-press: #08573D;
  --accent-tint: #E2EFE7;
  /* status */
  --overdue: #B42318;
  --overdue-tint: #FBE8E5;
  --due: #8A5600;
  --due-tint: #FBF0DA;
  --shop: #2D5385;
  --shop-tint: #E3EAF4;
  --skeleton: #E1E6DF;

  --display: "DIN Alternate", "Bahnschrift", "D-DIN", "DIN 2014", "Arial Narrow", sans-serif;
  --text: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

  --r-sm: 3px;
  --r: 6px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --panel-w: 400px;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0;
  font-family: var(--text);
  font-size: 0.9375rem; /* dense tool: 15px body */
  line-height: 1.45;
  color: var(--ink);
  background: var(--paper);
}
button, input, select { font: inherit; color: inherit; }
button, a, select, input[type="checkbox"] { touch-action: manipulation; }
.num, .display { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Prototype controls (outside the product) ---------- */
.proto {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4);
  margin: var(--s2); padding: var(--s1) var(--s3);
  border: 1px dashed #9AA69F; border-radius: var(--r);
  font: 0.8125rem/1.4 system-ui, sans-serif; color: #59625D; background: #fff;
}
.proto strong { font-weight: 600; }
.proto label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.proto button { border: 1px solid #B8C0BB; background: #fff; border-radius: 4px; padding: 2px 10px; cursor: pointer; }

/* ---------- App header ---------- */
.topbar {
  display: flex; align-items: center; gap: var(--s5);
  padding: var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: var(--s3); }
.brand .display { font-size: 1.375rem; line-height: 1; }
.brand span:last-child { color: var(--ink-2); font-size: 0.875rem; }
.nav { display: flex; gap: var(--s5); margin-inline-start: var(--s2); }
.nav a { color: var(--ink-2); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding-block: 6px; }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.today { margin-inline-start: auto; color: var(--ink-2); font-size: 0.875rem; white-space: nowrap; }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); }
main { min-width: 0; padding: var(--s5) var(--s5) 0; }

/* ---------- Depot board ---------- */
.board {
  background: var(--board);
  border-radius: var(--r);
  padding: var(--s4) var(--s4) var(--s4);
}
.tally { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s6); margin: 0 0 var(--s4); padding: 0 var(--s1); list-style: none; }
.tally li { display: flex; align-items: baseline; gap: var(--s2); }
.tally .num { font-size: 1.75rem; line-height: 1; }
.tally .of { font-size: 1rem; color: var(--ink-2); }
.tally .lab { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.tally .lab svg { position: relative; top: 1px; }
.tally .overdue .num, .tally .overdue .lab { color: var(--overdue); }
.tally .due .num, .tally .due .lab { color: var(--due); }
.tally .shop .num, .tally .shop .lab { color: var(--shop); }

.depots { display: grid; grid-template-columns: repeat(auto-fit, minmax(196px, 1fr)); gap: var(--s3); }
.depot { background: var(--surface); border-radius: var(--r-sm); padding: var(--s2) var(--s3) var(--s3); }
.depot h3 { display: flex; justify-content: space-between; margin: 0 0 var(--s2); font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); }
.depot h3 .num { font-weight: 700; color: var(--ink-3); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  height: 26px; padding: 0 7px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
  font-family: var(--display); font-weight: 700; font-size: 0.8125rem; font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.tag svg { font-size: 11px; stroke-width: 2.5; }
.tag:hover { border-color: var(--ink-3); }
.tag.due { background: var(--due-tint); border-color: #E4C68F; color: var(--due); }
.tag.overdue { background: var(--overdue); border-color: var(--overdue); color: #fff; }
.tag.shop { background: var(--shop); border-color: var(--shop); color: #fff; }
.tag.dim { opacity: 0.32; }
.tag.is-open { outline: 2px solid var(--ink); outline-offset: 1px; }
.tag.sk { width: 52px; border: 0; background: var(--skeleton); cursor: default; }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin: var(--s5) 0 var(--s3); }
.toolbar h2 { margin: 0 var(--s2) 0 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.2; }
.toolbar h2 .num { color: var(--ink-3); font-size: 1rem; margin-inline-start: 6px; }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search svg { position: absolute; inset-inline-start: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.search input {
  width: 100%; height: 36px; padding: 0 32px 0 32px;
  font-size: 1rem; /* 16px avoids iOS zoom */
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
}
.search input::placeholder { color: var(--ink-3); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.search .clear { position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: none; border-radius: 4px; color: var(--ink-2); cursor: pointer; }
.search .clear:hover { background: var(--hover); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 2px; }
.seg button { height: 30px; padding: 0 12px; border: 0; background: none; border-radius: 4px; font-size: 0.875rem; font-weight: 500; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.select { position: relative; }
.select select {
  height: 36px; padding: 0 30px 0 12px; appearance: none; -webkit-appearance: none;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
  font-size: 0.875rem; font-weight: 500; cursor: pointer;
}
.select svg { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-2); }

/* ---------- Table ---------- */
.sheet { background: var(--surface); border-radius: var(--r); }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td { text-align: start; padding: 0 var(--s3); height: 44px; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
thead th {
  position: sticky; top: 0; z-index: 1;
  height: 38px; background: var(--surface);
  font-size: 0.8125rem; font-weight: 600; color: var(--ink-2);
  border-bottom: 1px solid var(--line);
}
thead th:first-child { border-start-start-radius: var(--r); }
thead th:last-child { border-start-end-radius: var(--r); }
th.r, td.r { text-align: end; }
th button.sort { all: unset; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
th button.sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
th button.sort svg { opacity: 0; }
th[aria-sort] button.sort svg { opacity: 1; }
th[aria-sort="descending"] button.sort svg { transform: rotate(180deg); }
td.chk, th.chk { width: 44px; padding: 0; text-align: center; }
.chk label { display: grid; place-items: center; width: 44px; height: 44px; cursor: pointer; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--hover); }
tbody tr.is-checked td { background: var(--accent-tint); }
tbody tr.is-open td { background: var(--open); }
tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tbody tr.pending td { color: var(--ink-3); }
tbody tr:last-child td { border-bottom: 0; }
td.id { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.9375rem; }
td.odo { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.due-cell { display: inline-flex; align-items: center; gap: 6px; }
.due-cell .when { font-weight: 500; }
.due-cell .date { color: var(--ink-3); font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.875rem; }
.due-cell.overdue .when { color: var(--overdue); font-weight: 600; }
.due-cell.due .when { color: var(--due); font-weight: 600; }
.due-cell.muted .when { color: var(--ink-3); font-weight: 400; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: var(--r-sm); font-size: 0.8125rem; font-weight: 600; }
.chip.ok { color: var(--ink-2); padding-inline-start: 0; }
.chip.shop { background: var(--shop-tint); color: var(--shop); }
.chip.saving { color: var(--ink-3); padding-inline-start: 0; }

.sk-bar { display: block; height: 10px; border-radius: 2px; background: var(--skeleton); }
.empty td { height: auto; padding: var(--s6) var(--s5); white-space: normal; cursor: default; background: var(--surface) !important; }
.empty-box { max-width: 46ch; }
.empty-box h3 { margin: 0 0 var(--s1); font-size: 1rem; font-weight: 600; }
.empty-box p { margin: 0 0 var(--s4); color: var(--ink-2); }
.empty tr, tr.empty { cursor: default; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  height: 36px; padding: 0 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface);
  font-size: 0.875rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-press); }
.btn[disabled] { cursor: progress; opacity: 0.75; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--hover); }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-inline-end-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Selection bar ---------- */
.actionbar-slot { position: sticky; bottom: 0; z-index: 2; padding: var(--s3) 0 max(var(--s3), env(safe-area-inset-bottom)); }
.actionbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3);
  padding: var(--s2) var(--s2) var(--s2) var(--s4);
  background: var(--ink); color: #fff; border-radius: var(--r);
  box-shadow: 0 1px 2px rgba(22,35,30,.18), 0 4px 10px rgba(22,35,30,.14), 0 12px 28px rgba(22,35,30,.10);
}
.actionbar[hidden] { display: none; }
.actionbar .msg { flex: 1 1 260px; min-width: 0; font-weight: 500; }
.actionbar .msg strong { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; }
.actionbar .btn.ghost { color: #fff; }
.actionbar .btn.ghost:hover { background: rgba(255,255,255,.1); }
.actionbar .btn.primary { background: #fff; border-color: #fff; color: var(--accent); }
.actionbar .btn.primary:hover { background: #E8F1EC; }
.actionbar.error { background: #FFF; color: var(--ink); box-shadow: inset 0 0 0 1px #E8B4AD, 0 4px 10px rgba(22,35,30,.10), 0 12px 28px rgba(22,35,30,.08); }
.actionbar.error .msg { display: flex; gap: var(--s2); align-items: flex-start; font-weight: 400; }
.actionbar.error .msg svg { color: var(--overdue); margin-top: 3px; }
.actionbar.error .msg b { font-weight: 600; color: var(--overdue); }
.actionbar.error .btn.ghost { color: var(--ink); }
.actionbar.error .btn.ghost:hover { background: var(--hover); }
.actionbar.error .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.actionbar.done { background: var(--accent-tint); color: var(--ink); box-shadow: inset 0 0 0 1px #B9D6C6; }
.actionbar.done .msg { display: flex; gap: var(--s2); align-items: center; }
.actionbar.done svg { color: var(--accent); }

/* ---------- Side panel (logbook) ---------- */
.scrim { display: none; }
.panel {
  background: var(--surface);
  border-inline-start: 1px solid var(--line);
  overscroll-behavior: contain;
  overflow-y: auto;
}
.panel[hidden] { display: none; }
.panel-inner { padding: var(--s5); }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
.panel-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1.05; }
.panel-head h2:focus { outline: none; }
.panel-head h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: var(--r); background: none; color: var(--ink-2); cursor: pointer; font-size: 18px; margin: -4px -8px 0 0; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.panel .model { margin: var(--s1) 0 0; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4) var(--s4); margin: var(--s5) 0; padding: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 0.8125rem; color: var(--ink-3); margin-bottom: 2px; }
.facts dd { margin: 0; font-weight: 500; }
.facts dd .num { font-size: 1.0625rem; }
.facts dd .sub { display: block; font-size: 0.8125rem; color: var(--ink-2); font-weight: 400; }
.facts dd.overdue { color: var(--overdue); }
.facts dd.due { color: var(--due); }
.wo { margin: 0 0 var(--s5); padding: var(--s3) var(--s4); background: var(--shop-tint); border-radius: var(--r-sm); color: var(--ink); }
.wo p { margin: 0; }
.wo .wo-top { display: flex; gap: var(--s2); align-items: center; color: var(--shop); font-weight: 600; margin-bottom: 2px; }
.wo .wo-meta { color: var(--ink-2); font-size: 0.875rem; }
.panel-actions { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }
.panel-error { display: flex; gap: var(--s2); margin: var(--s3) 0 0; padding: var(--s3); background: var(--overdue-tint); border-radius: var(--r-sm); font-size: 0.875rem; }
.panel-error svg { color: var(--overdue); margin-top: 3px; }
.panel-error b { color: var(--overdue); font-weight: 600; }
.panel-done { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); font-weight: 600; font-size: 0.875rem; }

.log { margin-top: var(--s6); }
.log h3 { margin: 0 0 var(--s2); font-family: var(--display); font-weight: 700; font-size: 1.0625rem; }
.log ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.log li { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.log time { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.875rem; padding-top: 1px; }
.log .work { margin: 0; line-height: 1.4; }
.log .meta { margin: 2px 0 0; font-size: 0.8125rem; color: var(--ink-2); }
.log .meta .num { font-size: 0.8125rem; color: var(--ink); }
.log li.repair .work::before { content: none; }
.log .kind { display: inline-block; margin-inline-end: 6px; font-size: 0.75rem; font-weight: 600; color: var(--ink-2); }
.log li.new { background: var(--accent-tint); margin-inline: calc(var(--s2) * -1); padding-inline: var(--s2); }
.log .sk-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.log .sk-row span:last-child { display: grid; gap: 8px; }

/* Docked panel on laptops */
@media (min-width: 1200px) {
  .layout.has-panel { grid-template-columns: minmax(0, 1fr) var(--panel-w); }
  .panel { position: sticky; top: 0; height: 100dvh; align-self: start; }
}
/* Overlay panel on tablets and smaller */
@media (max-width: 1199.98px) {
  .scrim { display: block; position: fixed; inset: 0; background: rgba(22,35,30,.32); z-index: 10; opacity: 0; transition: opacity .2s ease; }
  .scrim.show { opacity: 1; }
  .scrim[hidden] { display: none; }
  .panel {
    position: fixed; z-index: 11; inset-block: 0; inset-inline-end: 0;
    width: min(var(--panel-w), 92vw); height: 100dvh;
    border-inline-start: 0;
    box-shadow: 0 0 0 1px rgba(22,35,30,.08), -4px 0 12px rgba(22,35,30,.10), -12px 0 32px rgba(22,35,30,.10);
    padding-bottom: env(safe-area-inset-bottom);
    transform: translateX(0); transition: transform .22s cubic-bezier(.2,.8,.2,1);
  }
  .panel.entering { transform: translateX(100%); }
}
@media (max-width: 900px) {
  .topbar { gap: var(--s4); padding-inline: var(--s4); }
  main { padding: var(--s4) var(--s4) 0; }
  .brand span:last-child { display: none; }
  .tally { gap: var(--s2) var(--s5); }
  .search { max-width: none; flex-basis: 100%; }
}
@media (max-width: 799.98px) {
  .sheet { overflow-x: auto; }
  table { min-width: 720px; }
}
@media (max-width: 600px) {
  .nav { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, .scrim { transition: none !important; }
  .spin { animation-duration: 2s; }
}
</style>
</head>
<body>

<aside class="proto" aria-label="Prototype controls">
  <strong>Prototype</strong>
  <label><input type="checkbox" id="failNext" checked> Fail the next save</label>
  <button type="button" id="reload">Reload data</button>
</aside>

<header class="topbar">
  <div class="brand"><span class="display">Relay</span><span>Alder Springs Public Works</span></div>
  <nav class="nav" aria-label="Main">
    <a href="#" aria-current="page">Vehicles</a>
    <a href="#">Work orders</a>
    <a href="#">Parts</a>
    <a href="#">Reports</a>
  </nav>
  <div class="today" id="today"></div>
</header>

<div class="layout" id="layout">
  <main>
    <section class="board" aria-label="Fleet by depot">
      <ul class="tally" id="tally"></ul>
      <div class="depots" id="depots"></div>
    </section>

    <div class="toolbar">
      <h2>Vehicles<span class="num" id="shownCount"></span></h2>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label for="q" class="sr-only">Search vehicles</label>
        <input id="q" type="search" placeholder="Search ID, type, make or depot" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="clear" id="qClear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="seg" role="group" aria-label="Status" id="statusSeg"></div>
      <div class="select">
        <label for="depot" class="sr-only">Depot</label>
        <select id="depot"></select>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="sheet">
      <table aria-describedby="shownCount">
        <thead>
          <tr>
            <th class="chk" scope="col"><label><input type="checkbox" id="selAll" aria-label="Select all shown vehicles"></label></th>
            <th scope="col" data-sort="id"><button class="sort" type="button">ID<svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></th>
            <th scope="col">Type</th>
            <th scope="col">Depot</th>
            <th scope="col" class="r" data-sort="odo"><button class="sort" type="button">Odometer (mi)<svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></th>
            <th scope="col" data-sort="due"><button class="sort" type="button">Next service<svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button></th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="actionbar-slot">

    </div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="panel" id="panel" hidden aria-labelledby="panelTitle"></aside>
</div>

<div class="sr-only" aria-live="polite" id="live"></div>

<script>
(() => {
"use strict";

/* ---------- Icons (one family: 24px grid, 2px stroke) ---------- */
const ICON = {
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
};
const icon = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name]}</svg>`;

/* ---------- Dates ---------- */
const TODAY = new Date(2026, 10, 6); // Friday, November 6, 2026
const DAY = 864e5;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (from, to) => Math.round((to - from) / DAY);
const fmtShort = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" });
const fmtLong = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" });
const fmtWeekday = new Intl.DateTimeFormat("en-US", { weekday: "short", month: "short", day: "numeric" });
const fmtNum = new Intl.NumberFormat("en-US");
const plural = new Intl.PluralRules("en-US");
const days = (n) => `${n} ${plural.select(n) === "one" ? "day" : "days"}`;
const vehiclesWord = (n) => `${n} ${plural.select(n) === "one" ? "vehicle" : "vehicles"}`;
document.getElementById("today").textContent =
  new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric" }).format(TODAY);

/* ---------- Fleet data ---------- */
const TYPES = {
  RF: { name: "Refuse truck", interval: 90,
        pm: "Preventive maintenance B: oil, filters, packer grease",
        repairs: ["Hydraulic hose replaced on packer arm", "Rear brake shoes and drums", "Tipper cart lift switch replaced", "DEF sensor replaced", "Front tires replaced (2)"] },
  TB: { name: "Transit bus", interval: 45,
        pm: "45-day inspection: brakes, ramp, HVAC, lights",
        repairs: ["Wheelchair ramp hinge adjusted", "Rear door sensitive edge replaced", "Destination sign controller replaced", "Alternator replaced", "Fare box mount repaired"] },
  SP: { name: "Snow plow", interval: 180,
        pm: "Seasonal service: blade, hydraulics, spreader",
        repairs: ["Cutting edge replaced", "Spreader conveyor chain replaced", "Plow lift cylinder resealed", "Strobe light bar replaced", "Wing plow pin and bushings"] },
  UV: { name: "Utility van", interval: 120,
        pm: "Oil change, filters, tire rotation",
        repairs: ["Ladder rack bolts torqued, crossbar replaced", "Battery replaced", "Rear door latch replaced", "Upfit inverter replaced", "Windshield replaced"] },
};
const DEPOTS = ["Harbor Street", "North Yard", "Westgate", "Mill Road"];
const TECHS = ["R. Okafor", "D. Lindqvist", "M. Reyes", "T. Brandt", "J. Whitehorse", "S. Patel"];

// id, depot, year, make, odometer, days until next service, [shop issue, days since opened]
const RAW = [
  ["RF-101", 0, 2019, "Mack LR 64", 98412, 23],
  ["RF-102", 0, 2019, "Mack LR 64", 112880, -6],
  ["RF-104", 0, 2021, "Peterbilt 520", 61207, 41],
  ["RF-107", 1, 2018, "Mack LR 64", 131566, -2, ["Packer cylinder leaking, bay 2", -3]],
  ["RF-109", 1, 2022, "Peterbilt 520", 44019, 9],
  ["RF-110", 1, 2020, "Mack LR 64", 87345, 58],
  ["RF-113", 2, 2017, "Autocar ACX", 142903, -11],
  ["RF-115", 2, 2021, "Peterbilt 520", 58770, 30],
  ["RF-116", 2, 2023, "Mack LR Electric", 18442, 66],
  ["RF-118", 3, 2019, "Autocar ACX", 104118, 12, ["Rear brake chambers, bay 4", -1]],
  ["RF-120", 3, 2020, "Mack LR 64", 91650, 4],
  ["RF-121", 3, 2022, "Peterbilt 520", 39804, 47],
  ["TB-201", 0, 2016, "Gillig Low Floor 40 ft", 361227, 17],
  ["TB-203", 0, 2018, "Gillig Low Floor 40 ft", 288914, -3],
  ["TB-205", 0, 2020, "New Flyer Xcelsior", 176402, 26],
  ["TB-208", 1, 2019, "New Flyer Xcelsior", 214330, 5, ["Wheelchair ramp actuator, bay 1", -2]],
  ["TB-210", 1, 2021, "Gillig Low Floor 35 ft", 132058, 11],
  ["TB-212", 1, 2015, "Gillig Low Floor 40 ft", 402671, 2],
  ["TB-214", 2, 2022, "New Flyer Xcelsior Charge", 88213, 35],
  ["TB-215", 2, 2018, "Gillig Low Floor 40 ft", 297540, 20],
  ["TB-216", 2, 2019, "New Flyer Xcelsior", 203118, 29],
  ["TB-217", 3, 2020, "New Flyer Xcelsior", 181906, 39],
  ["TB-219", 3, 2017, "Gillig Low Floor 35 ft", 318775, -1, ["HVAC compressor replacement, bay 5", -4]],
  ["SP-301", 0, 2018, "International HV607", 24118, 6],
  ["SP-302", 0, 2020, "Freightliner 108SD", 17560, 13],
  ["SP-305", 1, 2016, "International 7400", 41882, -9],
  ["SP-306", 1, 2021, "Freightliner 108SD", 12903, 18],
  ["SP-308", 2, 2019, "International HV607", 21447, -4, ["Spreader auger motor, bay 3", -2]],
  ["SP-309", 2, 2022, "Western Star 47X", 8612, 24],
  ["SP-311", 3, 2017, "International 7400", 36295, 15],
  ["SP-312", 3, 2020, "Freightliner 108SD", 19078, 1],
  ["SP-314", 3, 2015, "International 7400", 47331, -15, ["Hydraulic pump rebuild, bay 6", -8]],
  ["UV-401", 0, 2020, "Ford Transit 250", 68320, 52],
  ["UV-403", 0, 2022, "Ford E-Transit", 21902, 71],
  ["UV-404", 1, 2019, "Ram ProMaster 2500", 84615, -18],
  ["UV-406", 1, 2021, "Ford Transit 250", 47208, 33],
  ["UV-407", 2, 2018, "Ford Transit 350", 102744, 8],
  ["UV-409", 2, 2023, "Ford E-Transit", 9388, 88],
  ["UV-410", 3, 2020, "Ram ProMaster 2500", 71056, 44],
  ["UV-412", 3, 2017, "Ford Transit 350", 109872, 27, ["Check engine light, diagnostics, bay 2", -1]],
];

function rng(seed) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => {
    h += 0x6D2B79F5;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let woSeq = 1140;
function buildFleet() {
  return RAW.map(([id, depotIx, year, make, odo, dueIn, shop]) => {
    const prefix = id.slice(0, 2);
    const t = TYPES[prefix];
    const nextDue = addDays(TODAY, dueIn);
    const lastService = addDays(nextDue, -t.interval);
    const inServiceSince = new Date(year, 6, 1);
    const rate = odo / Math.max(1, diffDays(inServiceSince, TODAY)); // miles per day
    const shopWO = shop ? { wo: `WO-26-${++woSeq}`, issue: shop[0], opened: addDays(TODAY, shop[1]) } : null;
    return { id, prefix, type: t.name, depot: DEPOTS[depotIx], year, make, odo, nextDue, lastService, rate, shop: shopWO, history: null, inServiceSince };
  });
}

function buildHistory(v) {
  const t = TYPES[v.prefix];
  const r = rng(v.id);
  const odoAt = (d) => Math.round(v.odo - v.rate * diffDays(d, TODAY));
  const out = [];
  let d = v.lastService;
  for (let i = 0; i < 5 && d > v.inServiceSince; i++) {
    out.push({ date: d, kind: "Scheduled", work: t.pm, odo: odoAt(d), tech: TECHS[Math.floor(r() * TECHS.length)] });
    if (r() < 0.55) {
      const rd = addDays(d, -Math.max(3, Math.floor(r() * (t.interval - 4))));
      if (rd > v.inServiceSince) out.push({ date: rd, kind: "Repair", work: t.repairs[Math.floor(r() * t.repairs.length)], odo: odoAt(rd), tech: TECHS[Math.floor(r() * TECHS.length)] });
    }
    d = addDays(d, -t.interval);
  }
  return out.sort((a, b) => b.date - a.date);
}

/* ---------- State ---------- */
const state = {
  fleet: [],
  loading: true,
  q: "",
  status: "all",
  depot: "all",
  sort: { key: "due", dir: 1 },
  selected: new Set(),
  openId: null,
  saving: null,     // { ids:Set, origin:"bulk"|"panel" }
  saveError: null,  // { ids:[], origin }
  notice: null,     // { text, origin }
  historyLoading: false,
  justServiced: new Set(),
};

const STATUSES = [
  { key: "all", label: "All" },
  { key: "service", label: "In service" },
  { key: "overdue", label: "Overdue" },
  { key: "due", label: "Due soon" },
  { key: "shop", label: "In shop" },
];

function dueIn(v) { return diffDays(TODAY, v.nextDue); }
function urgency(v) {
  if (v.shop) return "shop";
  const d = dueIn(v);
  if (d < 0) return "overdue";
  if (d <= 14) return "due";
  return "ok";
}
function matchesStatus(v, s) {
  if (s === "all") return true;
  const u = urgency(v);
  if (s === "service") return u !== "shop";
  return u === s;
}
function matchesQuery(v, q) {
  if (!q) return true;
  const hay = `${v.id} ${v.id.replace("-", "")} ${v.type} ${v.make} ${v.year} ${v.depot}`.toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => hay.includes(w));
}
function filtered() {
  const list = state.fleet.filter((v) =>
    matchesStatus(v, state.status) && (state.depot === "all" || v.depot === state.depot) && matchesQuery(v, state.q.trim()));
  const { key, dir } = state.sort;
  const val = { id: (v) => v.id, odo: (v) => v.odo, due: (v) => v.nextDue.getTime() }[key];
  return list.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : a.id < b.id ? -1 : 1) * dir);
}
const byId = (id) => state.fleet.find((v) => v.id === id);

/* ---------- URL state (survives reload) ---------- */
function writeURL() {
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  if (state.status !== "all") p.set("status", state.status);
  if (state.depot !== "all") p.set("depot", state.depot);
  if (state.openId) p.set("vehicle", state.openId);
  try { history.replaceState(null, "", p.toString() ? "#" + p.toString() : location.pathname + location.search); } catch (_) {}
}
function readURL() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.q = p.get("q") || "";
  const s = p.get("status");
  state.status = STATUSES.some((x) => x.key === s) ? s : "all";
  const d = p.get("depot");
  state.depot = DEPOTS.includes(d) ? d : "all";
  state.openId = p.get("vehicle");
}

/* ---------- Elements ---------- */
const $ = (id) => document.getElementById(id);
const els = {
  tally: $("tally"), depots: $("depots"), rows: $("rows"), shown: $("shownCount"),
  q: $("q"), qClear: $("qClear"), seg: $("statusSeg"), depot: $("depot"), selAll: $("selAll"),
  bar: $("actionbar"), panel: $("panel"), scrim: $("scrim"), layout: $("layout"), live: $("live"),
  failNext: $("failNext"), reload: $("reload"),
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const announce = (t) => { els.live.textContent = ""; setTimeout(() => (els.live.textContent = t), 30); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* Delayed skeleton: hold back 200ms, then keep it up at least 400ms */
async function withSkeleton(work, show, hide) {
  let shownAt = 0;
  const t = setTimeout(() => { shownAt = performance.now(); show(); }, 200);
  const result = await work();
  clearTimeout(t);
  if (shownAt) { const left = 400 - (performance.now() - shownAt); if (left > 0) await wait(left); }
  hide();
  return result;
}

/* ---------- Render: board ---------- */
function renderBoard(skeleton) {
  if (skeleton) {
    els.tally.innerHTML = ["in service", "overdue", "due soon", "in shop"].map((l) =>
      `<li><span class="sk-bar" style="width:${l.length * 9 + 40}px;height:22px"></span></li>`).join("");
    els.depots.innerHTML = DEPOTS.map((d) =>
      `<div class="depot"><h3>${d}</h3><div class="tags">${'<span class="tag sk"></span>'.repeat(10)}</div></div>`).join("");
    return;
  }
  const f = state.fleet;
  const n = (u) => f.filter((v) => urgency(v) === u).length;
  const inService = f.filter((v) => !v.shop).length;
  els.tally.innerHTML = `
    <li><span class="num">${inService}</span><span class="of">of ${f.length}</span><span class="lab">in service</span></li>
    <li class="overdue"><span class="num">${n("overdue")}</span><span class="lab">${icon("alert")}overdue</span></li>
    <li class="due"><span class="num">${n("due")}</span><span class="lab">${icon("clock")}due soon</span></li>
    <li class="shop"><span class="num">${n("shop")}</span><span class="lab">${icon("wrench")}in the shop</span></li>`;

  const visible = new Set(filtered().map((v) => v.id));
  els.depots.innerHTML = DEPOTS.map((d) => {
    const list = f.filter((v) => v.depot === d).sort((a, b) => (a.id < b.id ? -1 : 1));
    const tags = list.map((v) => {
      const u = urgency(v);
      const ic = u === "overdue" ? icon("alert") : u === "due" ? icon("clock") : u === "shop" ? icon("wrench") : "";
      const label = `${v.id}, ${v.type}, ${statusPhrase(v)}`;
      return `<button type="button" class="tag ${u}${visible.has(v.id) ? "" : " dim"}${state.openId === v.id ? " is-open" : ""}" data-open="${v.id}" data-focus-key="tag:${v.id}" aria-label="${esc(label)}">${ic}${v.id}</button>`;
    }).join("");
    return `<div class="depot"><h3>${d}<span class="num">${list.length}</span></h3><div class="tags">${tags}</div></div>`;
  }).join("");
}

function statusPhrase(v) {
  const u = urgency(v), d = dueIn(v);
  if (u === "shop") return "in the shop";
  if (u === "overdue") return `service ${days(-d)} overdue`;
  if (d === 0) return "service due today";
  return `service due in ${days(d)}`;
}

/* ---------- Render: toolbar ---------- */
function renderToolbar() {
  els.seg.innerHTML = STATUSES.map((s) =>
    `<button type="button" data-status="${s.key}" data-focus-key="seg:${s.key}" aria-pressed="${state.status === s.key}">${s.label}</button>`).join("");
  els.depot.innerHTML = `<option value="all">All depots</option>` + DEPOTS.map((d) =>
    `<option value="${d}"${state.depot === d ? " selected" : ""}>${d}</option>`).join("");
  if (els.q.value !== state.q) els.q.value = state.q;
  els.qClear.hidden = !state.q;
  document.querySelectorAll("th[data-sort]").forEach((th) => {
    if (th.dataset.sort === state.sort.key) th.setAttribute("aria-sort", state.sort.dir === 1 ? "ascending" : "descending");
    else th.removeAttribute("aria-sort");
  });
}

/* ---------- Render: table ---------- */
function dueCell(v) {
  const d = dueIn(v), u = urgency(v);
  const date = `<span class="date">${fmtShort.format(v.nextDue)}</span>`;
  if (u === "shop") return `<span class="due-cell muted"><span class="when">${d < 0 ? "Was due" : "Due"}</span>${date}</span>`;
  if (u === "overdue") return `<span class="due-cell overdue">${icon("alert")}<span class="when">${days(-d)} overdue</span>${date}</span>`;
  const when = d === 0 ? "Today" : d === 1 ? "Tomorrow" : `In ${days(d)}`;
  return `<span class="due-cell ${u === "due" ? "due" : ""}">${u === "due" ? icon("clock") : ""}<span class="when">${when}</span>${date}</span>`;
}
function statusCell(v) {
  if (state.saving && state.saving.ids.has(v.id)) return `<span class="chip saving"><span class="spin" aria-hidden="true"></span>Saving…</span>`;
  if (v.shop) return `<span class="chip shop">${icon("wrench")}In shop</span>`;
  return `<span class="chip ok">${icon("checkCircle")}In service</span>`;
}

function renderTable(skeleton) {
  if (skeleton) {
    const w = [44, 80, 60, 70, 96, 56];
    els.rows.innerHTML = Array.from({ length: 9 }, (_, i) =>
      `<tr aria-hidden="true" style="cursor:default"><td class="chk"><span class="sk-bar" style="width:16px;height:16px;margin:auto"></span></td>${w.map((x, j) =>
        `<td${j === 3 ? ' class="r"' : ""}><span class="sk-bar" style="width:${x + ((i * 7 + j * 13) % 24)}px;${j === 3 ? "margin-inline-start:auto" : ""}"></span></td>`).join("")}</tr>`).join("");
    els.shown.textContent = "";
    els.selAll.checked = false; els.selAll.indeterminate = false; els.selAll.disabled = true;
    return;
  }
  const list = filtered();
  els.shown.textContent = list.length === state.fleet.length ? state.fleet.length : `${list.length} of ${state.fleet.length}`;

  if (!list.length) {
    const parts = [];
    if (state.q.trim()) parts.push(`“${esc(state.q.trim())}”`);
    const st = STATUSES.find((s) => s.key === state.status);
    const where = state.depot !== "all" ? ` at ${esc(state.depot)}` : "";
    const filt = state.status !== "all" ? ` with status ${st.label.toLowerCase()}` : "";
    const head = parts.length ? `No vehicles match ${parts[0]}${where}${filt}` : `No vehicles${where}${filt}`;
    const onlyStatusOrDepot = !state.q.trim();
    els.rows.innerHTML = `<tr class="empty"><td colspan="7"><div class="empty-box">
      <h3>${head}</h3>
      <p>${onlyStatusOrDepot ? "Try another depot or status." : "Check the vehicle ID, or search by type, make or depot."}</p>
      <div class="panel-actions">
        ${state.q.trim() ? `<button type="button" class="btn" data-act="clear-search" data-focus-key="act:clear-search">Clear search</button>` : ""}
        <button type="button" class="btn" data-act="clear-all" data-focus-key="act:clear-all">Clear all filters</button>
      </div></div></td></tr>`;
  } else {
    els.rows.innerHTML = list.map((v) => {
      const checked = state.selected.has(v.id);
      const pending = state.saving && state.saving.ids.has(v.id);
      const cls = [checked && "is-checked", state.openId === v.id && "is-open", pending && "pending"].filter(Boolean).join(" ");
      return `<tr class="${cls}" data-id="${v.id}" tabindex="0" data-focus-key="row:${v.id}"${pending ? ' aria-busy="true"' : ""}>
        <td class="chk"><label><input type="checkbox" data-check="${v.id}" data-focus-key="chk:${v.id}" ${checked ? "checked" : ""} ${state.saving ? "disabled" : ""} aria-label="Select ${v.id}"></label></td>
        <td class="id">${v.id}</td>
        <td>${v.type}</td>
        <td>${v.depot}</td>
        <td class="r odo">${fmtNum.format(v.odo)}</td>
        <td>${dueCell(v)}</td>
        <td>${statusCell(v)}</td>
      </tr>`;
    }).join("");
  }
  const sel = list.filter((v) => state.selected.has(v.id)).length;
  els.selAll.disabled = !list.length || !!state.saving;
  els.selAll.checked = list.length > 0 && sel === list.length;
  els.selAll.indeterminate = sel > 0 && sel < list.length;
}

/* ---------- Render: selection / save bar ---------- */
function renderBar() {
  const b = els.bar;
  const n = state.selected.size;
  const err = state.saveError && state.saveError.origin === "bulk" ? state.saveError : null;
  const notice = state.notice && state.notice.origin === "bulk" ? state.notice : null;
  const saving = state.saving && state.saving.origin === "bulk";
  b.className = "actionbar";
  if (err) {
    b.classList.add("error");
    b.innerHTML = `<div class="msg" role="alert">${icon("alert")}<span><b>${vehiclesWord(err.ids.length)} not marked as serviced.</b> Relay couldn’t reach the maintenance server. Check your connection and try again.</span></div>
      <button type="button" class="btn ghost" data-act="clear-sel" data-focus-key="act:clear-sel">Clear selection</button>
      <button type="button" class="btn primary" data-act="retry" data-focus-key="act:retry">Try again</button>`;
    b.hidden = false;
  } else if (n) {
    b.innerHTML = `<div class="msg"><strong>${n}</strong> selected</div>
      <button type="button" class="btn ghost" data-act="clear-sel" data-focus-key="act:clear-sel" ${saving ? "disabled" : ""}>Clear selection</button>
      <button type="button" class="btn primary" data-act="mark" data-focus-key="act:mark" ${saving ? "disabled" : ""}>${saving ? '<span class="spin" aria-hidden="true"></span>' : icon("check")}Mark as serviced</button>`;
    b.hidden = false;
  } else if (notice) {
    b.classList.add("done");
    b.innerHTML = `<div class="msg">${icon("checkCircle")}<span>${esc(notice.text)}</span></div>
      <button type="button" class="btn ghost" data-act="dismiss" data-focus-key="act:dismiss" style="color:var(--ink)">Dismiss</button>`;
    b.hidden = false;
  } else {
    b.hidden = true;
    b.innerHTML = "";
  }
}

/* ---------- Render: side panel ---------- */
function renderPanel() {
  const v = state.openId && byId(state.openId);
  const wasHidden = els.panel.hidden;
  if (!v || state.loading) {
    els.panel.hidden = true; els.scrim.hidden = true; els.scrim.classList.remove("show");
    els.layout.classList.remove("has-panel");
    els.panel.removeAttribute("role"); els.panel.removeAttribute("aria-modal");
    return;
  }
  const overlay = !matchMedia("(min-width: 1200px)").matches;
  els.layout.classList.add("has-panel");
  els.panel.hidden = false;
  if (overlay) { els.panel.setAttribute("role", "dialog"); els.panel.setAttribute("aria-modal", "true"); }
  else { els.panel.removeAttribute("role"); els.panel.removeAttribute("aria-modal"); }
  els.scrim.hidden = !overlay;
  if (overlay && wasHidden) {
    els.panel.classList.add("entering");
    requestAnimationFrame(() => requestAnimationFrame(() => { els.panel.classList.remove("entering"); els.scrim.classList.add("show"); }));
  } else if (overlay) els.scrim.classList.add("show");

  const u = urgency(v), d = dueIn(v);
  const dueClass = u === "overdue" ? "overdue" : u === "due" ? "due" : "";
  const dueSub = u === "shop" ? (d < 0 ? `Was due ${days(-d)} ago` : `In ${days(d)}`)
    : d < 0 ? `${days(-d)} overdue` : d === 0 ? "Today" : `In ${days(d)}`;
  const saving = state.saving && state.saving.origin === "panel" && state.saving.ids.has(v.id);
  const err = state.saveError && state.saveError.origin === "panel" && state.saveError.ids[0] === v.id;
  const done = state.notice && state.notice.origin === "panel" && state.notice.id === v.id;

  let log;
  if (state.historyLoading) {
    log = `<ol aria-busy="true">${Array.from({ length: 5 }, (_, i) =>
      `<li class="sk-row" aria-hidden="true"><span class="sk-bar" style="width:72px"></span><span><span class="sk-bar" style="width:${88 - i * 9}%"></span><span class="sk-bar" style="width:40%"></span></span></li>`).join("")}</ol>
      <p class="sr-only">Loading service history…</p>`;
  } else if (v.history) {
    log = `<ol>${v.history.map((h, i) =>
      `<li class="${h.kind === "Repair" ? "repair" : ""}${i === 0 && state.justServiced.has(v.id) ? " new" : ""}">
        <time datetime="${h.date.toISOString().slice(0, 10)}">${fmtLong.format(h.date)}</time>
        <div><p class="work"><span class="kind">${h.kind}</span>${esc(h.work)}</p>
        <p class="meta"><span class="num">${fmtNum.format(h.odo)}</span> mi, ${esc(h.tech)}</p></div>
      </li>`).join("")}</ol>`;
  } else log = "";

  els.panel.innerHTML = `<div class="panel-inner">
    <div class="panel-head">
      <h2 id="panelTitle" tabindex="-1" data-focus-key="panel-title">${v.id}</h2>
      <button type="button" class="icon-btn" data-act="close" data-focus-key="act:close" aria-label="Close ${v.id} details">${icon("x")}</button>
    </div>
    <p class="model">${v.year} ${esc(v.make)} ${v.type.toLowerCase()}, ${v.depot}</p>
    <dl class="facts">
      <div><dt>Odometer</dt><dd><span class="num">${fmtNum.format(v.odo)}</span> mi</dd></div>
      <div><dt>Status</dt><dd>${v.shop ? `<span class="chip shop">${icon("wrench")}In shop</span>` : `<span class="chip ok">${icon("checkCircle")}In service</span>`}</dd></div>
      <div><dt>Next service</dt><dd class="${dueClass}"><span class="num">${fmtShort.format(v.nextDue)}</span><span class="sub">${dueSub}</span></dd></div>
      <div><dt>Last service</dt><dd><span class="num">${fmtShort.format(v.lastService)}</span><span class="sub">Every ${days(TYPES[v.prefix].interval)}</span></dd></div>
    </dl>
    ${v.shop ? `<div class="wo"><p class="wo-top">${icon("wrench")}${v.shop.wo}</p><p>${esc(v.shop.issue)}</p><p class="wo-meta">Opened ${fmtWeekday.format(v.shop.opened)}</p></div>` : ""}
    <div class="panel-actions">
      <button type="button" class="btn${state.selected.size ? "" : " primary"}" data-act="mark-one" data-focus-key="act:mark-one" ${saving || state.saving ? "disabled" : ""}>${saving ? '<span class="spin" aria-hidden="true"></span>' : icon("check")}Mark as serviced</button>
      ${done ? `<span class="panel-done" role="status">${icon("checkCircle")}Marked as serviced</span>` : ""}
    </div>
    ${err ? `<div class="panel-error" role="alert">${icon("alert")}<span><b>${v.id} not marked as serviced.</b> Relay couldn’t reach the maintenance server. Check your connection and try again.</span></div>` : ""}
    <section class="log" aria-label="Service history">
      <h3>Service history</h3>
      ${log}
    </section>
  </div>`;
}

/* ---------- Render all, keeping focus on the equivalent control ---------- */
function render() {
  const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focusKey : null;
  if (state.loading) { renderBoard(true); renderToolbar(); renderTable(true); renderBar(); renderPanel(); return; }
  renderBoard(false); renderToolbar(); renderTable(false); renderBar(); renderPanel();
  if (key && !(document.activeElement && document.activeElement.dataset && document.activeElement.dataset.focusKey === key)) {
    const el = document.querySelector(`[data-focus-key="${CSS.escape(key)}"]`);
    if (el && !el.disabled) el.focus({ preventScroll: true });
  }
  writeURL();
}

/* ---------- Data loading ---------- */
async function loadFleet() {
  state.loading = true;
  state.selected.clear(); state.saveError = null; state.notice = null;
  render();
  els.rows.closest("table").setAttribute("aria-busy", "true");
  announce("Loading vehicles…");
  await wait(1100);
  const fleet = buildFleet();
  state.fleet = fleet;
  state.loading = false;
  els.rows.closest("table").removeAttribute("aria-busy");
  announce(`${fleet.length} vehicles loaded`);
  render();
  if (state.openId) openVehicle(state.openId, false);
}

async function openVehicle(id, focusPanel = true) {
  const v = byId(id);
  if (!v) { state.openId = null; render(); return; }
  state.openId = id;
  if (state.saveError && state.saveError.origin === "panel" && state.saveError.ids[0] !== id) state.saveError = null;
  if (state.notice && state.notice.origin === "panel") state.notice = null;
  state.historyLoading = false;
  render();
  if (focusPanel) $("panelTitle") && $("panelTitle").focus({ preventScroll: true });
  if (!v.history) {
    await withSkeleton(
      () => wait(600),
      () => { if (state.openId === id) { state.historyLoading = true; render(); } },
      () => { state.historyLoading = false; }
    );
    v.history = v.history || buildHistory(v);
    if (state.openId === id) render();
  }
}
function closePanel() {
  const id = state.openId;
  state.openId = null;
  if (state.saveError && state.saveError.origin === "panel") state.saveError = null;
  render();
  const row = document.querySelector(`[data-focus-key="row:${id}"]`) || document.querySelector(`[data-focus-key="tag:${id}"]`);
  if (row) row.focus({ preventScroll: true });
}

/* ---------- Saving ---------- */
async function markServiced(ids, origin) {
  if (state.saving || !ids.length) return;
  state.saving = { ids: new Set(ids), origin };
  state.saveError = null; state.notice = null;
  render();
  announce(`Marking ${vehiclesWord(ids.length)} as serviced…`);
  await wait(900);
  if (els.failNext.checked) {
    els.failNext.checked = false;
    state.saving = null;
    state.saveError = { ids, origin };
    render();
    return;
  }
  for (const id of ids) {
    const v = byId(id);
    const t = TYPES[v.prefix];
    if (!v.history) v.history = buildHistory(v);
    v.history.unshift({
      date: TODAY,
      kind: v.shop ? "Repair" : "Scheduled",
      work: v.shop ? `${v.shop.issue.replace(/, bay \d+$/, "")}: completed, ${v.shop.wo} closed` : t.pm,
      odo: v.odo, tech: "Fleet desk",
    });
    v.lastService = TODAY;
    v.nextDue = addDays(TODAY, t.interval);
    v.shop = null;
    state.justServiced.add(id);
  }
  state.saving = null;
  if (origin === "bulk") {
    state.selected.clear();
    state.notice = { origin, text: `${vehiclesWord(ids.length)} marked as serviced. Next service dates updated.` };
    announce(state.notice.text);
    const shown = state.notice;
    setTimeout(() => { if (state.notice === shown) { state.notice = null; render(); } }, 6000);
  } else {
    state.notice = { origin, id: ids[0] };
    announce(`${ids[0]} marked as serviced`);
  }
  render();
}

/* ---------- Events ---------- */
els.q.addEventListener("input", () => { state.q = els.q.value; pruneSelection(); state.saveError = null; render(); });
els.q.addEventListener("keydown", (e) => { if (e.key === "Escape" && els.q.value) { e.stopPropagation(); state.q = ""; render(); } });
els.qClear.addEventListener("click", () => { state.q = ""; render(); els.q.focus(); });
els.depot.addEventListener("change", () => { state.depot = els.depot.value; pruneSelection(); render(); });
els.seg.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-status]"); if (!b) return;
  state.status = b.dataset.status; pruneSelection(); render();
});
document.querySelectorAll("th[data-sort] button").forEach((b) => b.addEventListener("click", () => {
  const key = b.parentElement.dataset.sort;
  state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: 1 };
  render();
}));
els.selAll.addEventListener("change", () => {
  const list = filtered();
  if (els.selAll.checked) list.forEach((v) => state.selected.add(v.id));
  else list.forEach((v) => state.selected.delete(v.id));
  state.saveError = null; state.notice = null;
  render();
});
function pruneSelection() {
  const vis = new Set(filtered().map((v) => v.id));
  for (const id of state.selected) if (!vis.has(id)) state.selected.delete(id);
}
function toggle(id) {
  if (state.saving) return;
  state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id);
  if (state.saveError && state.saveError.origin === "bulk") state.saveError = null;
  state.notice = null;
  render();
}

els.rows.addEventListener("click", (e) => {
  const chk = e.target.closest("[data-check]");
  if (chk) { e.stopPropagation(); toggle(chk.dataset.check); return; }
  if (e.target.closest(".chk")) return; // label padding around the checkbox
  const act = e.target.closest("[data-act]");
  if (act) return handleAct(act.dataset.act);
  const tr = e.target.closest("tr[data-id]");
  if (tr) openVehicle(tr.dataset.id);
});
els.rows.addEventListener("keydown", (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (!tr || e.target !== tr) return;
  if (e.key === "Enter") { e.preventDefault(); openVehicle(tr.dataset.id); }
  else if (e.key === " ") { e.preventDefault(); toggle(tr.dataset.id); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const sib = e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling;
    if (sib && sib.dataset.id) sib.focus();
  }
});
els.depots.addEventListener("click", (e) => { const t = e.target.closest("[data-open]"); if (t) openVehicle(t.dataset.open); });
els.bar.addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) handleAct(a.dataset.act); });
els.panel.addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) handleAct(a.dataset.act); });
els.scrim.addEventListener("click", closePanel);

function handleAct(act) {
  switch (act) {
    case "mark": markServiced([...state.selected], "bulk"); break;
    case "retry": markServiced(state.saveError ? state.saveError.ids : [...state.selected], "bulk"); break;
    case "clear-sel": state.selected.clear(); state.saveError = null; render(); break;
    case "dismiss": state.notice = null; render(); break;
    case "mark-one": markServiced([state.openId], "panel"); break;
    case "close": closePanel(); break;
    case "clear-search": state.q = ""; render(); els.q.focus(); break;
    case "clear-all": state.q = ""; state.status = "all"; state.depot = "all"; render(); els.q.focus(); break;
  }
}

document.addEventListener("keydown", (e) => {
  const typing = e.target.closest && e.target.closest("input, select, textarea, [contenteditable]");
  if (e.key === "Escape" && state.openId && !typing) { closePanel(); return; }
  if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); els.q.focus(); }
});
// Keep keyboard focus inside the panel while it overlays the table.
els.panel.addEventListener("keydown", (e) => {
  if (e.key !== "Tab" || els.panel.getAttribute("aria-modal") !== "true") return;
  const f = [...els.panel.querySelectorAll("button:not([disabled]), [tabindex='-1']")];
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
matchMedia("(min-width: 1200px)").addEventListener("change", () => renderPanel());
els.reload.addEventListener("click", () => loadFleet());

readURL();
loadFleet();
})();
</script>
</body>
</html>
