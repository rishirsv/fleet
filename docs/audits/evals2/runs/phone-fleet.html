<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#dfe7e1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1310" media="(prefers-color-scheme: dark)">
<title>Ledger</title>
<style>
/* ---------- Tokens ---------- */
:root {
  /* primitives: ledger paper green, ink, red ink */
  --paper-50: oklch(0.993 0.006 150);
  --paper-100: oklch(0.975 0.012 150);
  --paper-200: oklch(0.945 0.018 152);
  --paper-300: oklch(0.905 0.022 154);
  --paper-400: oklch(0.86 0.026 155);
  --ink-500: oklch(0.47 0.03 160);
  --ink-900: oklch(0.24 0.03 160);
  --green-600: oklch(0.50 0.11 158);
  --green-700: oklch(0.44 0.10 158);
  --green-100: oklch(0.93 0.04 158);
  --red-600: oklch(0.50 0.17 27);
  --page-300: oklch(0.90 0.02 155);

  /* semantic roles */
  --bg-page: var(--page-300);
  --bg-paper: var(--paper-100);
  --bg-raised: var(--paper-50);
  --bg-tile: var(--paper-200);
  --bg-pressed: var(--paper-200);
  --bg-track: var(--paper-300);
  --text: var(--ink-900);
  --text-2: var(--ink-500);
  --separator: var(--paper-400);
  --accent: var(--green-600);
  --accent-pressed: var(--green-700);
  --accent-tint: var(--green-100);
  --on-accent: oklch(0.99 0.005 150);
  --danger: var(--red-600);
  --device: oklch(0.2 0.01 160);
  --scrim: oklch(0.2 0.03 160 / 0.32);
  --ring: oklch(0.24 0.03 160 / 0.08);
  --shadow-float: 0 1px 2px oklch(0.2 0.03 160 / 0.08), 0 6px 14px oklch(0.2 0.03 160 / 0.07), 0 18px 36px oklch(0.2 0.03 160 / 0.05);

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --font-fig: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --margin: 16px;
  --radius-group: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: oklch(0.14 0.012 160);
    --bg-paper: oklch(0.19 0.015 160);
    --bg-raised: oklch(0.235 0.016 160);
    --bg-tile: oklch(0.29 0.018 160);
    --bg-pressed: oklch(0.29 0.018 160);
    --bg-track: oklch(0.33 0.018 160);
    --text: oklch(0.94 0.01 150);
    --text-2: oklch(0.74 0.02 155);
    --separator: oklch(0.32 0.015 160);
    --accent: oklch(0.74 0.12 158);
    --accent-pressed: oklch(0.68 0.11 158);
    --accent-tint: oklch(0.32 0.05 158);
    --on-accent: oklch(0.18 0.03 160);
    --danger: oklch(0.72 0.15 27);
    --device: oklch(0.06 0.005 160);
    --scrim: oklch(0.05 0.01 160 / 0.55);
    --ring: oklch(0.98 0.01 150 / 0.10);
    --shadow-float: 0 1px 2px oklch(0 0 0 / 0.3), 0 6px 14px oklch(0 0 0 / 0.25), 0 18px 36px oklch(0 0 0 / 0.2);
  }
}

/* ---------- Page and device ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
html {
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  background: var(--bg-page);
  font-family: var(--font-ui);
  color: var(--text);
  display: grid;
  place-items: center;
  min-height: 100dvh;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.device {
  width: 414px; height: 868px;
  padding: 12px;
  border-radius: 67px;
  background: var(--device);
  box-shadow: inset 0 0 0 1.5px oklch(0.4 0.01 160 / 0.6), 0 2px 4px oklch(0 0 0 / 0.12), 0 20px 40px oklch(0 0 0 / 0.14), 0 50px 90px oklch(0 0 0 / 0.12);
  transform-origin: center;
  flex: none;
}
.screen {
  position: relative;
  width: 390px; height: 844px;
  border-radius: 55px;
  overflow: hidden;
  background: var(--bg-paper);
  isolation: isolate;
}

/* status bar */
.status {
  position: absolute; inset: 0 0 auto 0; height: 54px; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 34px 0 46px;
  font-weight: 600; font-size: 17px; letter-spacing: -0.01em;
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.status-icons { display: flex; gap: 7px; align-items: center; }
.island {
  position: absolute; top: 11px; left: 50%; translate: -50% 0;
  width: 126px; height: 37px; border-radius: 20px; background: #000; z-index: 60;
}
.home-indicator {
  position: absolute; bottom: 8px; left: 50%; translate: -50% 0; z-index: 60;
  width: 139px; height: 5px; border-radius: 3px; background: var(--text);
  pointer-events: none;
}

/* ---------- Panels and navigation ---------- */
.app { position: absolute; inset: 0; }
.panel { position: absolute; inset: 0; overflow: hidden; }
.panel[hidden] { display: block; visibility: hidden; }
.view {
  position: absolute; inset: 0;
  background: var(--bg-paper);
  overflow-y: auto; overscroll-behavior: contain;
  scrollbar-width: none;
  padding-bottom: 140px;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 132px), transparent calc(100% - 52px));
  mask-image: linear-gradient(to bottom, #000 calc(100% - 132px), transparent calc(100% - 52px));
  transition: transform 340ms var(--ease-drawer), opacity 340ms var(--ease-drawer);
}
.view::-webkit-scrollbar { display: none; }
.view.pushed { transform: translateX(100%); visibility: hidden; box-shadow: -1px 0 0 var(--separator); }
.panel.has-push .view.root { transform: translateX(-28%); opacity: 0.6; }
.panel.has-push .view.pushed { transform: none; visibility: visible; }
.view.pushed.leaving { visibility: visible; }

.navbar {
  position: sticky; top: 0; z-index: 5;
  height: 98px; padding: 54px 8px 0;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
  background: var(--bg-paper);
  box-shadow: 0 1px 0 transparent;
  transition: box-shadow 150ms ease;
}
.navbar.scrolled { box-shadow: 0 1px 0 var(--separator); }
.nav-title {
  grid-column: 2; font-size: 17px; font-weight: 600; line-height: 1.3;
  opacity: 0; transition: opacity 150ms ease;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px;
}
.navbar.scrolled .nav-title, .navbar.always .nav-title { opacity: 1; }
.back {
  grid-column: 1; justify-self: start;
  display: inline-flex; align-items: center; gap: 2px;
  min-height: 44px; padding: 0 10px 0 2px;
  border: 0; background: none; color: var(--accent); font-size: 17px;
  border-radius: 10px;
}
.back svg { width: 24px; height: 24px; }
.back:active { opacity: 0.55; }

.large-title {
  margin: 0; padding: 2px var(--margin) 0;
  font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em;
  text-wrap: balance;
}

.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 0 var(--margin); margin: 32px 0 8px;
}
.section-head h2 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.section-head.day { margin: 24px 0 8px; }
.section-head.day h2 { font-size: 15px; line-height: 1.35; color: var(--text-2); font-weight: 600; letter-spacing: 0; }
.section-head.day .fig { font-size: 15px; color: var(--text-2); }
.link {
  border: 0; background: none; color: var(--accent); font-size: 15px; padding: 10px 0 10px 12px; margin: -10px 0;
}
.link:active { opacity: 0.55; }

/* ---------- Figures ---------- */
.fig {
  font-family: var(--font-fig);
  font-variant-numeric: tabular-nums lining-nums;
  font-weight: 500;
  white-space: nowrap;
}

/* ---------- Spending summary ---------- */
.summary { padding: 16px var(--margin) 0; }
.summary-figure { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.summary-figure .spent {
  font-size: 52px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em;
  padding-bottom: 6px;
  /* accounting double rule under a total */
  background:
    linear-gradient(var(--text), var(--text)) left bottom / 100% 1.5px no-repeat,
    linear-gradient(var(--text), var(--text)) left calc(100% - 4px) / 100% 1.5px no-repeat;
}
.summary-figure .of { font-family: var(--font-fig); font-size: 20px; line-height: 1.25; color: var(--text-2); font-variant-numeric: tabular-nums; }

.meter { position: relative; margin-top: 24px; }
.bar { position: relative; display: block; height: 6px; border-radius: 3px; background: var(--bg-track); overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 3px; background: var(--accent); }
.bar.over > i { background: var(--danger); }
.meter .bar { height: 10px; border-radius: 5px; }
.meter .bar > i { border-radius: 5px; }
.pace-tick { position: absolute; top: -4px; width: 2px; height: 18px; border-radius: 1px; background: var(--text); translate: -1px 0; }
.pace-label {
  position: relative; height: 20px; margin-top: 6px;
  font-size: 13px; line-height: 1.35; color: var(--text-2);
}
.pace-label span { position: absolute; translate: -50% 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.summary-foot { display: flex; justify-content: space-between; gap: 16px; margin-top: 8px; font-size: 15px; line-height: 1.35; }
.summary-foot .left { font-weight: 600; }
.summary-foot .rate { color: var(--text-2); text-align: end; }
.is-over { color: var(--danger); }

/* ---------- Grouped lists ---------- */
.group {
  margin: 0 var(--margin);
  background: var(--bg-raised);
  border-radius: var(--radius-group);
  box-shadow: 0 0 0 1px var(--ring);
  overflow: hidden;
}
.row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 60px; padding: 10px 16px;
  border: 0; background: transparent; text-align: start;
}
button.row:active { background: var(--bg-pressed); }
.row + .row::before {
  content: ""; position: absolute; top: 0; inset-inline: 60px 0; height: 1px; background: var(--separator);
}
.tile {
  flex: none; width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--bg-tile); color: var(--text);
}
.tile svg { width: 20px; height: 20px; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-top, .row-bottom { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row-title { font-size: 17px; line-height: 1.3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { font-size: 15px; line-height: 1.35; color: var(--text-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-trail { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.row .fig { font-size: 17px; line-height: 1.3; }
.row-trail .sub { font-size: 13px; }
.row .bar { margin: 6px 0 4px; }
.chev { flex: none; width: 16px; height: 16px; color: var(--text-2); margin-inline-end: -4px; }
.row.fresh { animation: fresh 1800ms var(--ease-out); }
@keyframes fresh { from { background: var(--accent-tint); } to { background: transparent; } }

/* empty state */
.empty { padding: 32px 32px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.empty .tile { width: 56px; height: 56px; border-radius: 16px; }
.empty .tile svg { width: 30px; height: 30px; }
.empty h3 { margin: 16px 0 4px; font-size: 20px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.empty p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-2); text-wrap: pretty; max-width: 30ch; }
.btn-tinted {
  margin-top: 16px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 22px;
  background: var(--accent-tint); color: var(--accent); font-weight: 600; font-size: 17px;
  transition: transform 120ms var(--ease-out);
}
.btn-tinted:active { transform: scale(0.97); }

/* ---------- Tab bar ---------- */
.tabbar {
  position: absolute; z-index: 20; left: 16px; right: 16px; bottom: 26px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
.tabs {
  pointer-events: auto;
  display: flex; height: 62px; padding: 4px; border-radius: 31px;
  background: var(--bg-raised);
  box-shadow: 0 0 0 1px var(--ring), var(--shadow-float);
}
.tab {
  width: 86px; border: 0; border-radius: 27px; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--text-2); font-size: 11px; line-height: 1.2; font-weight: 600;
}
.tab svg { width: 26px; height: 26px; }
.tab .on { display: none; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--bg-tile); }
.tab[aria-selected="true"] .on { display: block; }
.tab[aria-selected="true"] .off { display: none; }
.tab:active { background: var(--bg-pressed); }
.add-btn {
  pointer-events: auto;
  width: 62px; height: 62px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent);
  box-shadow: 0 0 0 1px var(--ring), var(--shadow-float);
  transition: transform 120ms var(--ease-out), background-color 120ms ease;
}
.add-btn svg { width: 28px; height: 28px; }
.add-btn:active { transform: scale(0.95); background: var(--accent-pressed); }

/* ---------- Sheets ---------- */
.scrim {
  position: absolute; inset: 0; z-index: 70; background: var(--scrim);
  opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease-out);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; z-index: 80; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  background: var(--bg-raised);
  border-radius: 38px 38px 0 0;
  box-shadow: 0 0 0 1px var(--ring), 0 -8px 30px oklch(0.2 0.03 160 / 0.12);
  transform: translateY(105%);
  visibility: hidden;
  transition: transform 260ms var(--ease-out), visibility 0s linear 260ms;
  margin: 0;
}
.sheet.open {
  transform: translateY(0); visibility: visible;
  transition: transform 400ms var(--ease-drawer), visibility 0s;
}
.sheet-detail { max-height: 620px; padding-bottom: 34px; }
.sheet-add { top: 62px; background: var(--bg-paper); }
.grip { flex: none; height: 20px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.grip::after { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--separator); }
.sheet-bar {
  flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  min-height: 44px; padding: 0 8px; touch-action: none;
}
.sheet-bar h2 { grid-column: 2; margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; }
.nav-btn {
  min-height: 44px; padding: 0 12px; border: 0; background: none; border-radius: 10px;
  color: var(--accent); font-size: 17px;
}
.nav-btn:active { opacity: 0.55; }
.nav-btn.start { grid-column: 1; justify-self: start; }
.nav-btn.end { grid-column: 3; justify-self: end; font-weight: 600; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; scrollbar-width: none; }
.sheet-add .sheet-body { flex: 1; padding-bottom: 48px; }

/* detail sheet */
.detail-head { padding: 8px var(--margin) 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.detail-head .tile { width: 52px; height: 52px; border-radius: 15px; }
.detail-head .tile svg { width: 28px; height: 28px; }
.detail-head h2 { margin: 12px 0 0; font-size: 20px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; text-wrap: balance; }
.detail-head .fig { margin-top: 4px; font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
.kv { min-height: 48px; }
.kv .k { flex: none; font-size: 17px; line-height: 1.3; color: var(--text-2); }
.kv .v { flex: 1; min-width: 0; text-align: end; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.kv .v.fig { font-family: var(--font-fig); }
.sheet-detail .row + .row::before { inset-inline-start: 16px; }

/* add expense form */
.amount-wrap { padding: 32px var(--margin) 0; display: flex; flex-direction: column; align-items: center; }
.amount-field {
  display: flex; align-items: baseline; justify-content: center;
  padding: 0 8px 6px;
  border-bottom: 1.5px solid var(--separator);
  min-width: 180px; max-width: 100%;
  font-family: var(--font-fig); font-variant-numeric: tabular-nums lining-nums;
  font-size: 56px; line-height: 1.1; font-weight: 600;
}
.amount-field:focus-within { border-bottom-color: var(--accent); }
.amount-field.invalid { border-bottom-color: var(--danger); }
.amount-field .cur { color: var(--text-2); margin-inline-end: 2px; }
.amount-field input {
  width: 4.5ch; min-width: 0; max-width: 8.5ch; padding: 0; border: 0; background: none; outline: none;
  font: inherit; letter-spacing: -0.02em; text-align: start;
}
.amount-field input::placeholder { color: var(--bg-track); }
.err { margin: 8px 0 0; font-size: 15px; line-height: 1.35; color: var(--danger); display: flex; align-items: center; gap: 6px; }
.err svg { width: 16px; height: 16px; flex: none; }
.err[hidden] { display: none; }

fieldset { border: 0; margin: 32px 0 0; padding: 0; min-width: 0; }
legend, .field-label {
  padding: 0 var(--margin); margin-bottom: 8px;
  font-size: 15px; line-height: 1.35; font-weight: 600; color: var(--text-2);
}
fieldset .err { padding: 0 var(--margin); margin: -2px 0 8px; }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 var(--margin); }
.cat-opt { position: relative; }
.cat-opt input { position: absolute; opacity: 0; pointer-events: none; }
.cat-opt label {
  display: flex; align-items: center; gap: 10px;
  min-height: 52px; padding: 8px 10px 8px 10px;
  border-radius: 14px; background: var(--bg-raised);
  box-shadow: 0 0 0 1px var(--ring);
  font-size: 15px; line-height: 1.3; cursor: pointer;
  transition: box-shadow 120ms ease, background-color 120ms ease;
}
.cat-opt label:active { background: var(--bg-pressed); }
.cat-opt .tile { width: 30px; height: 30px; border-radius: 8px; }
.cat-opt .tile svg { width: 18px; height: 18px; }
.cat-opt .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cat-opt .check { width: 20px; height: 20px; color: var(--accent); visibility: hidden; flex: none; }
.cat-opt input:checked + label { box-shadow: 0 0 0 2px var(--accent); background: var(--accent-tint); font-weight: 600; }
.cat-opt input:checked + label .tile { background: var(--bg-raised); }
.cat-opt input:checked + label .check { visibility: visible; }
.cat-opt input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 3px; }
.cat-grid.invalid .cat-opt label { box-shadow: 0 0 0 1px var(--danger); }

.form-group { margin-top: 32px; }
.field-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 52px; padding: 8px 16px; position: relative;
  font-size: 17px; line-height: 1.3;
}
.field-row + .field-row::before { content: ""; position: absolute; top: 0; inset-inline: 16px 0; height: 1px; background: var(--separator); }
.field-row input[type="date"] {
  border: 0; background: var(--bg-tile); border-radius: 8px; padding: 6px 10px; min-height: 36px;
  font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums;
}
.field-row.note { flex-direction: column; align-items: stretch; gap: 4px; padding-top: 12px; }
.field-row.note .opt { color: var(--text-2); font-weight: 400; margin-inline-start: 6px; font-size: 15px; }
.field-row textarea {
  border: 0; background: none; resize: none; padding: 0; outline: none;
  font-size: 17px; line-height: 1.45; min-height: 52px;
}
.field-row textarea::placeholder { color: var(--text-2); opacity: 0.7; }
.field-row:has(textarea:focus-visible) { box-shadow: inset 0 0 0 2px var(--accent); border-radius: var(--radius-group); }

@media (prefers-reduced-motion: reduce) {
  .view, .sheet, .sheet.open { transition: opacity 200ms ease, visibility 0s linear 200ms; }
  .sheet.open { transition: opacity 200ms ease, visibility 0s; }
  .sheet { transform: none; opacity: 0; }
  .sheet.open { opacity: 1; }
  .view.pushed { transform: none; opacity: 0; }
  .panel.has-push .view.root { transform: none; opacity: 0; }
  .panel.has-push .view.pushed { opacity: 1; }
  .row.fresh { animation-duration: 2400ms; }
}
</style>
</head>
<body>

<div class="device" id="device">
  <div class="screen" id="screen">
    <div class="island" aria-hidden="true"></div>
    <div class="status" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">

        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".45"/></svg>

            <svg class="on" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></svg>

    <form class="sheet sheet-add" id="sheet-add" role="dialog" aria-modal="true" aria-labelledby="a-title" novalidate inert>
      <div class="grip" aria-hidden="true"></div>

        <button type="button" class="nav-btn start" data-close>Cancel</button>

        <button type="submit" class="nav-btn end">Save</button>

        <div class="amount-wrap">
          <label for="amount" class="vh">Amount in US dollars</label>

          <legend>Category</legend>

          <label class="field-row">
            <span>Date</span>
            <input type="date" id="date" name="date" required>
          </label>
          <label class="field-row note">
            <span>Note<span class="opt">Optional</span></span>
            <textarea id="note" name="note" rows="2" maxlength="140" placeholder="Dinner with Priya"></textarea>

    <div class="home-indicator" aria-hidden="true"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- Icons ---------- */
  const I = (d, extra = "") =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}${extra}</svg>`;
  const ICONS = {
    groceries: I('<path d="M3.5 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.25"/><circle cx="16.5" cy="19" r="1.25"/>'),
    dining: I('<path d="M7 3v6a2 2 0 0 0 2 2v10M11 3v6a2 2 0 0 1-2 2M9 3v5"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/>'),
    transport: I('<path d="M4 16.5V12l2.2-5.2A1.5 1.5 0 0 1 7.6 6h8.8a1.5 1.5 0 0 1 1.4.8L20 12v4.5Z"/><path d="M4 12h16M6.5 16.5V19M17.5 16.5V19"/><circle cx="7.5" cy="14.2" r=".4"/><circle cx="16.5" cy="14.2" r=".4"/>'),
    bills: I('<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>'),
    shopping: I('<path d="M5 8h14l-1 12H6Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/>'),
    entertainment: I('<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4Z"/><path d="M14.5 7.5v2M14.5 11v2M14.5 14.5v2"/>'),
    health: I('<path d="M9.5 4h5v5.5H20v5h-5.5V20h-5v-5.5H4v-5h5.5Z"/>'),
    gifts: I('<path d="M4 9h16v4H4ZM5.5 13v7h13v-7M12 9v11"/><path d="M12 9c-1.2-3.4-5-4-5-1.6C7 9 10 9 12 9Zm0 0c1.2-3.4 5-4 5-1.6C17 9 14 9 12 9Z"/>'),
  };
  const CHEV_R = '<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';
  const CHEV_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>';
  const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
  const ALERT = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5v4"/><circle cx="8" cy="11.2" r=".3" fill="currentColor"/></svg>';

  /* ---------- Data (demonstration content) ---------- */
  const TODAY = new Date(2026, 10, 18);           // Wed, Nov 18 2026
  const TODAY_ISO = "2026-11-18";
  const DAYS_IN_MONTH = 30;

  const CATEGORIES = [
    { id: "groceries", name: "Groceries", budget: 650 },
    { id: "dining", name: "Dining out", budget: 340 },
    { id: "transport", name: "Transport", budget: 180 },
    { id: "bills", name: "Bills and utilities", budget: 460 },
    { id: "shopping", name: "Shopping", budget: 300 },
    { id: "entertainment", name: "Entertainment", budget: 120 },
    { id: "health", name: "Health", budget: 200 },
    { id: "gifts", name: "Gifts", budget: 150 },
  ];
  const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
  const MONTHLY_BUDGET = CATEGORIES.reduce((s, c) => s + c.budget, 0);

  const VISA = "Visa ···· 4821", DEBIT = "Checking ···· 0937";
  let seq = 0;
  const T = (date, time, merchant, cat, amount, account, note = "") =>
    ({ id: "t" + (++seq), date, time, merchant, cat, amount, account, note });

  const txns = [
    T("2026-11-01", "8:02 AM", "Verizon Wireless", "bills", 85.00, DEBIT, "Autopay"),
    T("2026-11-01", "9:15 AM", "Spotify", "entertainment", 11.99, VISA),
    T("2026-11-01", "5:48 PM", "Trader Joe’s", "groceries", 64.32, VISA),
    T("2026-11-02", "7:31 AM", "Clipper card reload", "transport", 40.00, VISA),
    T("2026-11-02", "8:12 AM", "Blue Bottle Coffee", "dining", 6.75, VISA),
    T("2026-11-03", "12:40 PM", "Chipotle", "dining", 14.85, VISA),
    T("2026-11-03", "6:00 PM", "Comcast Xfinity", "bills", 79.99, DEBIT, "Internet"),
    T("2026-11-04", "6:22 PM", "Safeway", "groceries", 41.87, VISA),
    T("2026-11-05", "10:05 AM", "Lemonade Insurance", "bills", 14.00, DEBIT, "Renters insurance"),
    T("2026-11-05", "7:14 PM", "Target", "shopping", 47.93, VISA),
    T("2026-11-06", "11:48 PM", "Lyft", "transport", 18.42, VISA),
    T("2026-11-07", "9:20 AM", "Tartine Bakery", "dining", 18.50, VISA),
    T("2026-11-07", "8:05 PM", "Nopalito", "dining", 62.40, VISA, "Split with Sam"),
    T("2026-11-08", "11:30 AM", "Whole Foods Market", "groceries", 88.15, VISA),
    T("2026-11-08", "4:10 PM", "Netflix", "entertainment", 15.49, VISA),
    T("2026-11-08", "7:45 PM", "AMC Metreon 16", "entertainment", 38.50, VISA, "Two tickets"),
    T("2026-11-09", "1:02 PM", "Shell", "transport", 52.30, VISA),
    T("2026-11-09", "3:26 PM", "Walgreens", "health", 23.48, VISA),
    T("2026-11-10", "8:09 AM", "Blue Bottle Coffee", "dining", 6.75, VISA),
    T("2026-11-10", "9:00 AM", "PG&E", "bills", 142.67, DEBIT, "Gas and electric, October"),
    T("2026-11-11", "6:37 PM", "Trader Joe’s", "groceries", 57.09, VISA),
    T("2026-11-12", "9:00 AM", "SF Water Power Sewer", "bills", 64.21, DEBIT),
    T("2026-11-12", "12:55 PM", "Souvla", "dining", 24.30, VISA),
    T("2026-11-13", "5:40 PM", "Uniqlo", "shopping", 79.80, VISA, "Winter jacket"),
    T("2026-11-14", "10:12 AM", "Bi-Rite Market", "groceries", 23.40, VISA),
    T("2026-11-14", "8:30 PM", "Zuni Café", "dining", 118.60, VISA, "Mom’s birthday dinner"),
    T("2026-11-15", "2:18 PM", "Ticketmaster", "entertainment", 84.00, VISA, "Japanese Breakfast, Dec 12"),
    T("2026-11-15", "11:52 PM", "Lyft", "transport", 23.17, VISA),
    T("2026-11-16", "8:04 AM", "Blue Bottle Coffee", "dining", 7.25, VISA),
    T("2026-11-16", "7:51 PM", "Amazon", "shopping", 26.49, VISA, "Phone charger"),
    T("2026-11-17", "6:15 PM", "Trader Joe’s", "groceries", 71.26, VISA),
    T("2026-11-18", "12:24 PM", "DoorDash", "dining", 32.18, VISA, "Thai lunch"),
  ];

  /* ---------- Formatting ---------- */
  const LOCALE = "en-US";
  const money = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD" });
  const money0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const fmt = n => money.format(n);
  const fmtBudget = n => (Number.isInteger(n) ? money0 : money).format(n);
  const dShort = new Intl.DateTimeFormat(LOCALE, { month: "short", day: "numeric" });
  const dHead = new Intl.DateTimeFormat(LOCALE, { weekday: "long", month: "short", day: "numeric" });
  const dHeadYear = new Intl.DateTimeFormat(LOCALE, { weekday: "long", month: "short", day: "numeric", year: "numeric" });
  const dLong = new Intl.DateTimeFormat(LOCALE, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  const rel = new Intl.RelativeTimeFormat(LOCALE, { numeric: "auto" });
  const plural = new Intl.PluralRules(LOCALE);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  const parseISO = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const dayDiff = iso => Math.round((parseISO(iso) - TODAY) / 86400000);
  const minutes = t => { const [, h, m, ap] = t.match(/(\d+):(\d+)\s*(AM|PM)/); return (+h % 12 + (ap === "PM" ? 12 : 0)) * 60 + +m; };
  const sortKey = t => t.date + String(minutes(t.time)).padStart(4, "0") + t.id.slice(1).padStart(4, "0");
  const dayLabel = iso => {
    const diff = dayDiff(iso);
    if (diff === 0 || diff === -1) return cap(rel.format(diff, "day"));
    const d = parseISO(iso);
    return (d.getFullYear() === TODAY.getFullYear() ? dHead : dHeadYear).format(d);
  };
  const shortDate = iso => {
    const diff = dayDiff(iso);
    if (diff === 0 || diff === -1) return cap(rel.format(diff, "day"));
    return dShort.format(parseISO(iso));
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const round2 = n => Math.round(n * 100) / 100;

  /* ---------- Derived figures ---------- */
  const inThisMonth = t => t.date.slice(0, 7) === TODAY_ISO.slice(0, 7);
  const sorted = () => [...txns].sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const catStats = c => {
    const items = txns.filter(t => t.cat === c.id && inThisMonth(t));
    const spent = round2(items.reduce((s, t) => s + t.amount, 0));
    return { ...c, items, spent, left: round2(c.budget - spent), ratio: spent / c.budget };
  };
  const monthStats = () => {
    const spent = round2(txns.filter(inThisMonth).reduce((s, t) => s + t.amount, 0));
    const day = TODAY.getDate();
    const daysLeft = DAYS_IN_MONTH - day;
    return { spent, left: round2(MONTHLY_BUDGET - spent), pace: round2(MONTHLY_BUDGET * day / DAYS_IN_MONTH), daysLeft };
  };

  /* ---------- Templates ---------- */
  const bar = (ratio, over) => `<span class="bar${over ? " over" : ""}" aria-hidden="true"><i style="--w:${Math.min(ratio, 1) * 100}%"></i></span>`;

  const leftText = s => s.items.length === 0 ? "No spending yet"
    : s.left < 0 ? `${fmt(-s.left)} over` : `${fmt(s.left)} left`;

  const catRow = s => {
    const over = s.left < 0;
    return `<button class="row cat-row" data-cat="${s.id}">
      <span class="tile">${ICONS[s.id]}</span>
      <span class="row-main">
        <span class="row-top"><span class="row-title">${esc(s.name)}</span><span class="fig">${fmt(s.spent)}</span></span>
        ${bar(s.ratio, over)}
        <span class="row-bottom"><span class="sub${over ? " is-over" : ""}">${leftText(s)}</span><span class="sub">of ${fmtBudget(s.budget)}</span></span>
      </span>${CHEV_R}
    </button>`;
  };

  const txnRow = (t, showDate) => `<button class="row txn-row${t.id === freshId ? " fresh" : ""}" data-txn="${t.id}">
      <span class="tile">${ICONS[t.cat]}</span>
      <span class="row-main"><span class="row-title">${esc(t.merchant)}</span><span class="sub">${esc(CAT[t.cat].name)}</span></span>
      <span class="row-trail"><span class="fig">${fmt(t.amount)}</span>${showDate ? `<span class="sub">${shortDate(t.date)}</span>` : ""}</span>
    </button>`;

  const navbar = (title, back) => `<header class="navbar">
      ${back ? `<button class="back" data-back>${CHEV_L}<span>${esc(back)}</span></button>` : ""}
      <span class="nav-title" aria-hidden="true">${esc(title)}</span>
    </header>`;

  function homeHTML() {
    const m = monthStats();
    const overBudget = m.left < 0;
    const pacePct = (m.pace / MONTHLY_BUDGET) * 100;
    const perDay = m.daysLeft > 0 ? m.left / m.daysLeft : 0;
    const daysWord = plural.select(m.daysLeft) === "one" ? "day" : "days";
    const watch = CATEGORIES.map(catStats).filter(s => s.items.length).sort((a, b) => b.ratio - a.ratio).slice(0, 3);
    const recent = sorted().slice(0, 5);
    return `${navbar("November")}
      <h1 class="large-title">November</h1>
      <div class="summary">
        <div class="summary-figure">
          <span class="fig spent">${fmt(m.spent)}</span><span class="of">of ${fmtBudget(MONTHLY_BUDGET)}</span>
        </div>
        <div class="meter" role="img" aria-label="${fmt(m.spent)} spent of ${fmtBudget(MONTHLY_BUDGET)}. Even pace for today is ${fmt(m.pace)}.">
          ${bar(m.spent / MONTHLY_BUDGET, overBudget)}
          <span class="pace-tick" style="left:${pacePct}%"></span>
          <div class="pace-label" aria-hidden="true"><span style="left:clamp(56px, ${pacePct}%, calc(100% - 56px))">Even pace ${fmtBudget(Math.round(m.pace))}</span></div>
        </div>
        <div class="summary-foot">
          <span class="left${overBudget ? " is-over" : ""}">${overBudget ? `${fmt(-m.left)} over budget` : `${fmt(m.left)} left`}</span>
          <span class="rate">${overBudget || m.daysLeft === 0 ? `${m.daysLeft} ${daysWord} to go` : `${money0.format(Math.floor(perDay))} a day for ${m.daysLeft} ${daysWord}`}</span>
        </div>
      </div>

      <div class="section-head"><h2>Closest to limit</h2><button class="link" data-goto="budgets">See all</button></div>
      <div class="group">${watch.map(catRow).join("")}</div>

      <div class="section-head"><h2>Recent</h2><button class="link" data-goto="activity">See all</button></div>
      <div class="group">${recent.map(t => txnRow(t, true)).join("")}</div>`;
  }

  function activityHTML() {
    const days = [];
    for (const t of sorted()) {
      const last = days[days.length - 1];
      if (last && last.date === t.date) last.items.push(t); else days.push({ date: t.date, items: [t] });
    }
    return `${navbar("Activity")}
      <h1 class="large-title">Activity</h1>
      ${days.map(d => `
        <div class="section-head day"><h2>${dayLabel(d.date)}</h2><span class="fig">${fmt(round2(d.items.reduce((s, t) => s + t.amount, 0)))}</span></div>
        <div class="group">${d.items.map(t => txnRow(t, false)).join("")}</div>`).join("")}`;
  }

  function budgetsHTML() {
    return `${navbar("Budgets")}
      <h1 class="large-title">Budgets</h1>
      <div class="group" style="margin-top:16px">${CATEGORIES.map(c => catRow(catStats(c))).join("")}</div>`;
  }

  function categoryHTML(id, backLabel) {
    const s = catStats(CAT[id]);
    const over = s.left < 0;
    const items = s.items.sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
    const body = items.length ? `
        <div class="section-head"><h2>This month</h2></div>
        <div class="group">${items.map(t => txnRow(t, true)).join("")}</div>`
      : `<div class="empty">
          <span class="tile">${ICONS[s.id]}</span>
          <h3>No ${esc(s.name.toLowerCase())} spending yet</h3>
          <p>Expenses you add to ${esc(s.name)} this month show up here.</p>
          <button class="btn-tinted" data-add-cat="${s.id}">Add expense</button>
        </div>`;
    return `${navbar(s.name, backLabel)}
      <h1 class="large-title">${esc(s.name)}</h1>
      <div class="summary">
        <div class="summary-figure"><span class="fig spent">${fmt(s.spent)}</span><span class="of">of ${fmtBudget(s.budget)}</span></div>
        <div class="meter">${bar(s.ratio, over)}</div>
        <div class="summary-foot"><span class="left${over ? " is-over" : ""}">${s.items.length === 0 ? `${fmtBudget(s.budget)} left` : leftText(s)}</span></div>
      </div>
      ${body}`;
  }

  /* ---------- State and rendering ---------- */
  const TABS = ["home", "activity", "budgets"];
  const state = { tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home", pushed: { home: null, activity: null, budgets: null } };
  let freshId = null;

  const panel = tab => document.getElementById("panel-" + tab);
  const rootView = tab => panel(tab).querySelector(".view.root");
  const pushedView = tab => panel(tab).querySelector(".view.pushed");

  function render() {
    rootView("home").innerHTML = homeHTML();
    rootView("activity").innerHTML = activityHTML();
    rootView("budgets").innerHTML = budgetsHTML();
    for (const tab of TABS) {
      const id = state.pushed[tab];
      if (id) pushedView(tab).innerHTML = categoryHTML(id, rootView(tab).dataset.title);
    }
    document.querySelectorAll(".view").forEach(syncNavbar);
    freshId = null;
  }

  function syncNavbar(view) {
    const nb = view.querySelector(".navbar");
    if (nb) nb.classList.toggle("scrolled", view.scrollTop > 36);
  }
  document.querySelectorAll(".view").forEach(v => v.addEventListener("scroll", () => syncNavbar(v), { passive: true }));

  function selectTab(tab, focus) {
    state.tab = tab;
    for (const t of TABS) panel(t).hidden = t !== tab;
    document.querySelectorAll(".tab").forEach(b => {
      const on = b.dataset.tab === tab;
      b.setAttribute("aria-selected", on);
      b.tabIndex = on ? 0 : -1;
    });
    history.replaceState(null, "", "#" + tab);
    if (focus) document.querySelector(`.tab[data-tab="${tab}"]`).focus();
  }

  let pushTrigger = null;
  function push(tab, catId, trigger) {
    pushTrigger = trigger || null;
    state.pushed[tab] = catId;
    const pv = pushedView(tab);
    pv.innerHTML = categoryHTML(catId, rootView(tab).dataset.title);
    pv.scrollTop = 0;
    syncNavbar(pv);
    pv.inert = false;
    rootView(tab).inert = true;
    panel(tab).classList.add("has-push");
    pv.querySelector("[data-back]").focus({ preventScroll: true });
  }
  function pop(tab) {
    const pv = pushedView(tab);
    state.pushed[tab] = null;
    pv.inert = true;
    rootView(tab).inert = false;
    pv.classList.add("leaving");
    panel(tab).classList.remove("has-push");
    const done = () => pv.classList.remove("leaving");
    pv.addEventListener("transitionend", done, { once: true });
    setTimeout(done, 450);
    if (pushTrigger && pushTrigger.isConnected) pushTrigger.focus({ preventScroll: true });
    else {
      const sel = pushTrigger && pushTrigger.dataset.cat ? `[data-cat="${pushTrigger.dataset.cat}"]` : null;
      const again = sel && rootView(tab).querySelector(sel);
      (again || document.querySelector(`.tab[data-tab="${tab}"]`)).focus({ preventScroll: true });
    }
  }

  /* ---------- Sheets ---------- */
  const scrim = document.getElementById("scrim");
  const app = document.getElementById("app");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  let openSheet = null, sheetTrigger = null;

  function showSheet(sheet, trigger) {
    if (openSheet && openSheet !== sheet) hideSheet(openSheet, { restoreFocus: false });
    openSheet = sheet;
    sheetTrigger = trigger || document.activeElement;
    sheet.style.transform = ""; sheet.style.transition = "";
    sheet.inert = false;
    app.inert = true;
    sheet.classList.add("open");
    scrim.classList.add("open");
    scrim.style.opacity = "";
  }
  function hideSheet(sheet, { restoreFocus = true } = {}) {
    if (!sheet.classList.contains("open")) return;
    sheet.classList.remove("open");
    sheet.style.transition = ""; sheet.style.transform = "";
    sheet.inert = true;
    if (openSheet === sheet) {
      openSheet = null;
      scrim.classList.remove("open");
      scrim.style.opacity = "";
      app.inert = false;
      if (restoreFocus && sheetTrigger && sheetTrigger.isConnected) sheetTrigger.focus({ preventScroll: true });
    }
  }
  scrim.addEventListener("click", () => openSheet && hideSheet(openSheet));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && openSheet) { e.preventDefault(); hideSheet(openSheet); }
  });
  document.querySelectorAll(".sheet [data-close]").forEach(b => b.addEventListener("click", () => hideSheet(b.closest(".sheet"))));

  // Drag down to dismiss, tracked 1:1 from the grip and header bar.
  function enableDrag(sheet) {
    const handles = sheet.querySelectorAll(".grip, .sheet-bar");
    let startY = 0, dy = 0, samples = [], dragging = false, pointerId = null;
    const onDown = e => {
      if (e.button !== 0 || e.target.closest("button, input, textarea")) return;
      dragging = true; pointerId = e.pointerId; startY = e.clientY; dy = 0;
      samples = [{ y: e.clientY, t: e.timeStamp }];
      e.currentTarget.setPointerCapture(pointerId);
      sheet.style.transition = "none";
    };
    const onMove = e => {
      if (!dragging || e.pointerId !== pointerId) return;
      const raw = e.clientY - startY;
      // resist upward pulls instead of stopping hard
      dy = raw >= 0 ? raw : -(Math.abs(raw) * 60 * 0.55) / (60 + 0.55 * Math.abs(raw));
      sheet.style.transform = `translateY(${dy}px)`;
      const h = sheet.offsetHeight;
      scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / h));
      samples.push({ y: e.clientY, t: e.timeStamp });
      if (samples.length > 5) samples.shift();
    };
    const onUp = e => {
      if (!dragging || e.pointerId !== pointerId) return;
      dragging = false;
      const a = samples[0], b = samples[samples.length - 1];
      const v = b.t > a.t ? (b.y - a.y) / (b.t - a.t) : 0;     // px per ms
      const projected = dy + v * 200;   // where the release is heading ~200ms later
      sheet.style.transition = "";
      if (dy > 0 && (projected > sheet.offsetHeight * 0.33 || v > 0.6)) hideSheet(sheet);
      else { sheet.style.transform = ""; scrim.style.opacity = ""; }
    };
    handles.forEach(h => {
      h.addEventListener("pointerdown", onDown);
      h.addEventListener("pointermove", onMove);
      h.addEventListener("pointerup", onUp);
      h.addEventListener("pointercancel", onUp);
    });
  }

  /* detail sheet */
  const detailSheet = document.getElementById("sheet-detail");
  const detailBody = document.getElementById("detail-body");
  enableDrag(detailSheet);

  function openDetail(id, trigger) {
    const t = txns.find(x => x.id === id);
    if (!t) return;
    const c = catStats(CAT[t.cat]);
    const budgetValue = c.left < 0
      ? `<span class="is-over">${fmt(-c.left)} over</span>`
      : `${fmt(c.left)} left`;
    detailBody.innerHTML = `
      <div class="detail-head">
        <span class="tile">${ICONS[t.cat]}</span>
        <h2 id="d-title">${esc(t.merchant)}</h2>
        <span class="fig">${fmt(t.amount)}</span>
      </div>
      <div class="group">
        <div class="row kv"><span class="k">Category</span><span class="v">${esc(CAT[t.cat].name)}</span></div>
        <div class="row kv"><span class="k">Date</span><span class="v">${dLong.format(parseISO(t.date))}, ${esc(t.time)}</span></div>
        <div class="row kv"><span class="k">Paid with</span><span class="v">${esc(t.account)}</span></div>
        ${t.note ? `<div class="row kv"><span class="k">Note</span><span class="v">${esc(t.note)}</span></div>` : ""}
      </div>
      ${inThisMonth(t) ? `<div class="group" style="margin-top:24px"><div class="row kv"><span class="k">${esc(CAT[t.cat].name)} budget</span><span class="v">${budgetValue}</span></div></div>` : ""}`;
    detailBody.scrollTop = 0;
    showSheet(detailSheet, trigger);
    detailSheet.querySelector("[data-close]").focus({ preventScroll: true });
  }

  /* add expense sheet */
  const addSheet = document.getElementById("sheet-add");
  const amountInput = document.getElementById("amount");
  const amountField = document.getElementById("amount-field");
  const amountErr = document.getElementById("amount-err");
  const catErr = document.getElementById("cat-err");
  const catGrid = document.getElementById("cat-grid");
  const dateInput = document.getElementById("date");
  const noteInput = document.getElementById("note");
  enableDrag(addSheet);

  catGrid.innerHTML = CATEGORIES.map(c => `<div class="cat-opt">
      <input type="radio" name="cat" id="cat-${c.id}" value="${c.id}">
      <label for="cat-${c.id}"><span class="tile">${ICONS[c.id]}</span><span class="name">${esc(c.name)}</span>${CHECK}</label>
    </div>`).join("");
  dateInput.max = TODAY_ISO;

  const sizeAmount = () => { amountInput.style.width = Math.max(4.5, amountInput.value.length + 0.5) + "ch"; };
  const setError = (el, msg) => {
    el.hidden = !msg;
    el.innerHTML = msg ? `${ALERT}<span>${esc(msg)}</span>` : "";
  };
  const clearAmountError = () => { setError(amountErr, ""); amountField.classList.remove("invalid"); amountInput.removeAttribute("aria-invalid"); };
  const clearCatError = () => { setError(catErr, ""); catGrid.classList.remove("invalid"); };

  amountInput.addEventListener("input", () => {
    // keep digits and one decimal point; accept pasted "$1,234.50"
    let v = amountInput.value.replace(/[^\d.]/g, "");
    const i = v.indexOf(".");
    if (i !== -1) v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "").slice(0, 2);
    if (v !== amountInput.value) amountInput.value = v;
    sizeAmount();
    if (!amountErr.hidden) clearAmountError();
  });
  catGrid.addEventListener("change", clearCatError);

  function resetForm(catId) {
    addSheet.reset();
    amountInput.value = "";
    dateInput.value = TODAY_ISO;
    if (catId) document.getElementById("cat-" + catId).checked = true;
    clearAmountError(); clearCatError(); sizeAmount();
    addSheet.querySelector(".sheet-body").scrollTop = 0;
  }

  function openAdd(trigger, catId) {
    resetForm(catId);
    showSheet(addSheet, trigger);
    amountInput.focus({ preventScroll: true });
  }

  addSheet.addEventListener("submit", e => {
    e.preventDefault();
    const raw = amountInput.value.trim();
    const amount = round2(parseFloat(raw));
    const cat = (addSheet.querySelector('input[name="cat"]:checked') || {}).value;
    let firstInvalid = null;

    if (!raw || Number.isNaN(amount)) {
      setError(amountErr, "Enter an amount");
    } else if (amount <= 0) {
      setError(amountErr, "Enter an amount greater than $0.00");
    } else if (amount > 99999.99) {
      setError(amountErr, "Enter an amount up to $99,999.99");
    } else clearAmountError();
    if (!amountErr.hidden) { amountField.classList.add("invalid"); amountInput.setAttribute("aria-invalid", "true"); firstInvalid = amountInput; }

    if (!cat) { setError(catErr, "Choose a category"); catGrid.classList.add("invalid"); firstInvalid = firstInvalid || catGrid.querySelector("input"); }
    else clearCatError();

    let date = dateInput.value;
    if (!date || date > TODAY_ISO) date = TODAY_ISO;

    if (firstInvalid) { firstInvalid.focus(); firstInvalid.scrollIntoView({ block: "center", behavior: reduceMotion.matches ? "auto" : "smooth" }); return; }

    const now = new Date();
    const time = now.toLocaleTimeString(LOCALE, { hour: "numeric", minute: "2-digit" });
    const note = noteInput.value.trim();
    const t = T(date, time, note || `${CAT[cat].name} expense`, cat, amount, "Added manually", "");
    txns.push(t);
    freshId = t.id;
    render();
    hideSheet(addSheet);
  });

  /* ---------- Event wiring ---------- */
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab");
    if (!b) return;
    if (b.dataset.tab === state.tab && state.pushed[state.tab]) pop(state.tab);   // tap active tab: back to its root
    else selectTab(b.dataset.tab);
  });
  document.querySelector(".tabs").addEventListener("keydown", e => {
    const i = TABS.indexOf(state.tab);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      selectTab(TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length], true);
    }
  });
  document.getElementById("add-btn").addEventListener("click", e => openAdd(e.currentTarget));

  app.addEventListener("click", e => {
    const tab = e.target.closest(".panel")?.dataset.tab;
    const txn = e.target.closest("[data-txn]");
    if (txn) return openDetail(txn.dataset.txn, txn);
    const cat = e.target.closest("[data-cat]");
    if (cat) return push(tab, cat.dataset.cat, cat);
    if (e.target.closest("[data-back]")) return pop(tab);
    const go = e.target.closest("[data-goto]");
    if (go) return selectTab(go.dataset.goto, true);
    const addCat = e.target.closest("[data-add-cat]");
    if (addCat) return openAdd(addCat, addCat.dataset.addCat);
  });

  /* ---------- Fit the device to the window ---------- */
  const device = document.getElementById("device");
  const fit = () => {
    const s = Math.min(1, (innerHeight - 32) / 868, (innerWidth - 32) / 414);
    device.style.transform = s < 1 ? `scale(${s})` : "";
  };
  addEventListener("resize", fit);
  fit();

  render();
  selectTab(state.tab);
})();
</script>
</body>
</html>
