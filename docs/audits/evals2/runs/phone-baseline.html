<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger · iOS</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --label2: rgba(60,60,67,.62);
    --label3: rgba(60,60,67,.32);
    --sep: rgba(60,60,67,.18);
    --fill: rgba(118,118,128,.12);
    --accent: #0F766E;
    --accent-soft: rgba(15,118,110,.12);
    --warn: #FF9500;
    --danger: #FF3B30;
    --ease: cubic-bezier(.32,.72,0,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #EEECE7 0%, #DCD9D2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--label);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
  input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* Device */
  .stage { transform-origin: center center; }
  .device {
    position: relative;
    width: 414px; height: 868px;
    padding: 12px;
    border-radius: 68px;
    background: #1B1B1D;
    box-shadow:
      inset 0 0 0 2px #3A3A3D,
      inset 0 0 0 5px #111,
      0 40px 80px -20px rgba(0,0,0,.35),
      0 18px 36px -18px rgba(0,0,0,.4);
  }
  .device::before, .device::after {
    content: ""; position: absolute; width: 4px; border-radius: 2px; background: #2A2A2D;
  }
  .device::before { left: -3px; top: 170px; height: 62px; box-shadow: 0 -78px 0 -6px #2A2A2D, 0 80px 0 0 #2A2A2D; }
  .device::after { right: -3px; top: 230px; height: 98px; }
  .screen {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 56px;
    overflow: hidden;
    background: #000;
    isolation: isolate;
  }

  /* Status bar */
  .statusbar {
    position: absolute; inset: 0 0 auto 0; height: 47px; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 30px 0 46px;
    pointer-events: none;
    transition: color .3s;
  }
  .statusbar.light { color: #fff; }
  .statusbar .time { font-weight: 600; font-size: 17px; letter-spacing: -.2px; width: 54px; text-align: center; }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }
  .island {
    position: absolute; left: 50%; top: 11px; transform: translateX(-50%);
    width: 124px; height: 36px; border-radius: 20px; background: #000;
  }
  .home-ind {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 100; pointer-events: none;
  }

  /* App surface */
  .app {
    position: absolute; inset: 0;
    background: var(--bg);
    border-radius: 56px;
    overflow: hidden;
    transform-origin: 50% 0;
    transition: transform .45s var(--ease), border-radius .45s var(--ease), filter .45s var(--ease);
  }
  .app.recessed { transform: translateY(12px) scale(.92); border-radius: 22px; filter: brightness(.72); }

  .pane { position: absolute; inset: 0; display: none; overflow: hidden; }
  .pane.active { display: block; }
  .scroll, .push {
    position: absolute; inset: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 47px 0 112px;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .scroll::-webkit-scrollbar, .push::-webkit-scrollbar { display: none; }
  .scroll { transition: transform .45s var(--ease); }
  .pane.pushed > .scroll { transform: translateX(-28%); }
  .push {
    background: var(--bg); z-index: 2;
    transform: translateX(100%);
    transition: transform .45s var(--ease);
    box-shadow: -10px 0 30px rgba(0,0,0,.08);
  }
  .push.open { transform: none; }

  /* Navigation */
  .nav { display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 20px 10px; }
  .large-title { font-size: 34px; font-weight: 700; letter-spacing: .2px; line-height: 41px; margin: 0; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #F6C9A8, #E58E6A);
    color: #fff; font-weight: 600; font-size: 14px; margin-bottom: 3px;
  }
  .backbar { display: flex; align-items: center; height: 44px; padding: 0 8px; }
  .back { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; padding: 6px 8px; }

  /* Hero */
  .hero { margin: 4px 16px 0; background: var(--card); border-radius: 20px; padding: 18px 18px 16px; }
  .hero-top { display: flex; justify-content: space-between; align-items: baseline; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .4px; }
  .pace { font-size: 13px; font-weight: 600; }
  .pace.over { color: #C56A00; }
  .pace.under { color: var(--accent); }
  .big { font-size: 44px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin-top: 6px; }
  .big small { font-size: 26px; font-weight: 600; letter-spacing: -.4px; color: var(--label2); }
  .of { font-size: 15px; color: var(--label2); margin-top: 2px; }
  .meter { position: relative; height: 10px; border-radius: 5px; background: var(--fill); margin: 16px 0 6px; }
  .meter > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--accent); }
  .meter .marker { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--label); opacity: .55; }
  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 14px; border-top: .5px solid var(--sep); padding-top: 12px; }
  .stat-l { font-size: 13px; color: var(--label2); }
  .stat-v { font-size: 20px; font-weight: 600; margin-top: 2px; letter-spacing: -.3px; }

  /* Sections */
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 20px 8px; }
  .sec-h h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .1px; }
  .link { color: var(--accent); font-size: 17px; }
  .group-label { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .3px; padding: 22px 36px 7px; display: flex; justify-content: space-between; }

  /* Category tiles */
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
  .tile { background: var(--card); border-radius: 18px; padding: 14px; display: block; width: 100%; transition: transform .15s; }
  .tile:active, .row:active, .brow:active { transform: scale(.98); }
  .tile-top { display: flex; align-items: center; gap: 8px; }
  .tile-name { font-size: 15px; font-weight: 600; }
  .tile-amt { font-size: 20px; font-weight: 600; margin-top: 12px; letter-spacing: -.3px; }
  .tile-of { font-size: 13px; color: var(--label2); }
  .bar { height: 5px; border-radius: 3px; background: var(--fill); margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; }

  .ci {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center;
    background: var(--c); color: #fff;
  }
  .ci svg { width: 18px; height: 18px; }
  .ci.lg { width: 40px; height: 40px; border-radius: 11px; }
  .ci.lg svg { width: 22px; height: 22px; }
  .ci.xl { width: 64px; height: 64px; border-radius: 18px; }
  .ci.xl svg { width: 34px; height: 34px; }

  /* Lists */
  .list { background: var(--card); border-radius: 16px; margin: 0 16px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 10px 16px; min-height: 62px; position: relative; transition: transform .15s, background .15s;
  }
  .row:hover { background: rgba(0,0,0,.02); }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; border-top: .5px solid var(--sep); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub { font-size: 13px; color: var(--label2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-amt { font-size: 16px; font-weight: 600; }
  .new-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: 2px; }

  /* Search */
  .search { margin: 2px 16px 0; height: 36px; border-radius: 10px; background: var(--fill); display: flex; align-items: center; gap: 6px; padding: 0 8px; color: var(--label2); }
  .search input { flex: 1; border: 0; outline: 0; background: none; font-size: 17px; color: var(--label); }
  .search input::placeholder { color: var(--label2); }
  .search .clear { display: none; color: var(--label3); }
  .search.has-text .clear { display: grid; }
  .empty-note { text-align: center; color: var(--label2); padding: 48px 32px; font-size: 15px; }

  /* Budgets */
  .sum-card { margin: 4px 16px 0; background: var(--card); border-radius: 20px; padding: 16px 18px; }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; }
  .sum-row b { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .seg { display: flex; height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; margin-top: 14px; gap: 2px; }
  .seg i { display: block; height: 100%; }
  .brow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px 13px 16px; position: relative; transition: transform .15s; }
  .brow + .brow::before { content: ""; position: absolute; top: 0; left: 68px; right: 0; border-top: .5px solid var(--sep); }
  .brow-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .brow-name { font-size: 16px; font-weight: 500; }
  .brow-left { font-size: 15px; font-weight: 600; }
  .brow-left.warn { color: #C56A00; }
  .brow-left.over { color: var(--danger); }
  .brow-sub { font-size: 13px; color: var(--label2); margin-top: 6px; }
  .brow .bar { margin-top: 7px; }
  .chev { color: var(--label3); flex: none; }

  /* Category screen */
  .cat-head { display: flex; align-items: center; gap: 12px; padding: 4px 20px 12px; }
  .empty-card { margin: 0 16px; background: var(--card); border-radius: 20px; padding: 30px 24px 24px; text-align: center; }
  .empty-card .ci { margin: 0 auto 14px; }
  .empty-title { font-size: 17px; font-weight: 600; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; height: 44px; padding: 0 20px; border-radius: 22px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px; }

  /* Account */
  .profile { display: flex; align-items: center; gap: 14px; margin: 4px 16px 0; background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .profile .avatar { width: 56px; height: 56px; font-size: 21px; margin: 0; }
  .p-name { font-size: 20px; font-weight: 600; }
  .p-mail { font-size: 14px; color: var(--label2); margin-top: 2px; }
  .srow { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; position: relative; width: 100%; }
  .srow + .srow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .srow .k { flex: 1; font-size: 16px; }
  .srow .v { color: var(--label2); font-size: 16px; }
  .switch { width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,.16); position: relative; transition: background .25s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform .25s var(--ease); }
  .switch[aria-checked="true"] { background: #34C759; }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }

  /* Tab bar */
  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 83px; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr);
    padding: 0 6px 34px;
    background: rgba(249,249,249,.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid rgba(0,0,0,.16);
  }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 7px; gap: 3px; color: #8E8E93; font-size: 10px; font-weight: 500; letter-spacing: .1px; }
  .tab svg { width: 26px; height: 26px; }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab-add { display: grid; place-items: start center; }
  .fab {
    width: 54px; height: 54px; border-radius: 50%; margin-top: -14px;
    display: grid; place-items: center;
    background: var(--accent); color: #fff;
    box-shadow: 0 8px 18px -6px rgba(15,118,110,.6), 0 0 0 5px rgba(249,249,249,.9);
    transition: transform .15s;
  }
  .fab:active { transform: scale(.92); }

  /* Sheets */
  .backdrop { position: absolute; inset: 0; z-index: 60; background: rgba(0,0,0,.38); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 61;
    background: var(--bg);
    border-radius: 38px 38px 0 0;
    padding-bottom: 34px;
    transform: translateY(105%);
    transition: transform .45s var(--ease);
    max-height: calc(100% - 58px);
    display: flex; flex-direction: column;
  }
  .sheet.open { transform: none; }
  .sheet-head { position: relative; height: 50px; flex: none; touch-action: none; cursor: grab; }
  .grabber { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,.3); }
  .x-btn { position: absolute; right: 16px; top: 16px; width: 30px; height: 30px; border-radius: 50%; background: rgba(118,118,128,.14); color: rgba(60,60,67,.62); display: grid; place-items: center; }
  .sheet-body { overflow-y: auto; scrollbar-width: none; padding-bottom: 8px; }
  .d-hero { text-align: center; padding: 0 24px 6px; }
  .d-hero .ci { margin: 0 auto 12px; }
  .d-title { font-size: 20px; font-weight: 600; }
  .d-amt { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-top: 4px; }
  .d-when { font-size: 15px; color: var(--label2); margin-top: 2px; }
  .kv { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; min-height: 46px; position: relative; }
  .kv + .kv::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .kv .k { color: var(--label2); font-size: 16px; flex: none; }
  .kv .v { font-size: 16px; text-align: right; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .kv.note { align-items: flex-start; flex-direction: column; gap: 4px; padding: 12px 16px; }
  .kv.note .v { text-align: left; line-height: 1.35; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .ctx { padding: 14px 16px; }
  .ctx-line { display: flex; justify-content: space-between; font-size: 15px; }
  .ctx-line span:last-child { color: var(--label2); }

  /* Add modal */
  .modal {
    position: absolute; left: 0; right: 0; bottom: 0; top: 58px; z-index: 62;
    background: var(--bg);
    border-radius: 14px 14px 0 0;
    transform: translateY(105%);
    transition: transform .45s var(--ease);
    display: flex; flex-direction: column;
    box-shadow: 0 -2px 20px rgba(0,0,0,.2);
  }
  .modal.open { transform: none; }
  .m-head { flex: none; height: 56px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px; touch-action: none; position: relative; }
  .m-head .grabber { top: 5px; }
  .m-head h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .m-cancel { color: var(--accent); font-size: 17px; justify-self: start; padding: 6px 0; }
  .m-body { flex: 1; overflow-y: auto; scrollbar-width: none; padding-bottom: 16px; }
  .amount-block { text-align: center; padding: 18px 16px 8px; }
  .amount-wrap { display: inline-flex; align-items: baseline; justify-content: center; position: relative; transition: color .2s; }
  .amount-wrap .cur { font-size: 40px; font-weight: 600; color: var(--label2); margin-right: 2px; }
  .amount-wrap input {
    border: 0; outline: 0; background: none; padding: 0;
    font-size: 64px; font-weight: 700; letter-spacing: -1.5px; font-variant-numeric: tabular-nums;
    text-align: left; width: 40px; caret-color: var(--accent); min-width: 40px; max-width: 290px;
  }
  .amount-wrap input::placeholder { color: var(--label3); }
  .mirror { position: absolute; visibility: hidden; white-space: pre; font-size: 64px; font-weight: 700; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .amount-underline { height: 2px; width: 140px; margin: 4px auto 0; border-radius: 1px; background: var(--sep); transition: background .2s; }
  .err { color: var(--danger); font-size: 14px; font-weight: 500; height: 20px; margin-top: 8px; opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .invalid .err, .err.on { opacity: 1; transform: none; }
  .invalid .amount-wrap .cur, .invalid .amount-wrap input::placeholder { color: rgba(255,59,48,.55); }
  .invalid .amount-underline { background: var(--danger); }
  .shake { animation: shake .42s; }
  @keyframes shake { 15%,55% { transform: translateX(-8px); } 35%,75% { transform: translateX(8px); } 90% { transform: translateX(-3px); } }

  .cat-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; margin: 0 16px; background: var(--card); border-radius: 16px; padding: 16px 8px 14px; }
  .pick { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--label2); }
  .pick .ci { width: 46px; height: 46px; border-radius: 50%; background: color-mix(in srgb, var(--c) 14%, white); color: var(--c); transition: background .2s, color .2s, box-shadow .2s; }
  .pick .ci svg { width: 22px; height: 22px; }
  .pick[aria-checked="true"] { color: var(--label); font-weight: 600; }
  .pick[aria-checked="true"] .ci { background: var(--c); color: #fff; box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--c); }
  .field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 50px; position: relative; }
  .field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .field label { font-size: 16px; flex: none; width: 56px; }
  .field input { flex: 1; border: 0; outline: 0; background: none; font-size: 16px; text-align: right; min-width: 0; }
  .field input::placeholder { color: var(--label3); }
  .field input[type="date"] { color: var(--accent); font-weight: 500; }
  .field .count { font-size: 12px; color: var(--label3); width: 34px; text-align: right; flex: none; }
  .m-foot { flex: none; padding: 10px 16px 42px; background: linear-gradient(to bottom, rgba(242,242,247,0), var(--bg) 30%); }
  .primary { width: 100%; height: 52px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; text-align: center; transition: transform .15s, opacity .15s; }
  .primary:active { transform: scale(.98); opacity: .9; }

  /* Toast */
  .toast {
    position: absolute; left: 50%; top: 56px; z-index: 90;
    transform: translate(-50%, -16px) scale(.96); opacity: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; border-radius: 22px;
    background: rgba(28,28,30,.92); color: #fff; font-size: 15px; font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: transform .35s var(--ease), opacity .25s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  .toast .ok { width: 22px; height: 22px; border-radius: 50%; background: #34C759; display: grid; place-items: center; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="device">
    <div class="screen" id="screen">

      <div class="app" id="app">
        <section class="pane active" id="pane-home" aria-label="Home"><div class="scroll" id="home"></div></section>

        <section class="pane" id="pane-activity" aria-label="Activity">
          <div class="scroll">
            <div class="nav"><h1 class="large-title">Activity</h1></div>
            <div class="search" id="search">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>
              <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search transactions">
              <button class="clear" data-action="clear-search" aria-label="Clear search"><svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8.5 8.5 7 7m0-7-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
            <div id="activity-list"></div>
          </div>
        </section>

        <section class="pane" id="pane-budgets" aria-label="Budgets">
          <div class="scroll" id="budgets"></div>
          <div class="push" id="push" aria-hidden="true"></div>
        </section>

        <section class="pane" id="pane-account" aria-label="Account"><div class="scroll" id="account"></div></section>

        <nav class="tabbar" role="tablist" aria-label="Tabs">
          <button class="tab" role="tab" data-action="tab" data-tab="home" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1v-9.5z"/></svg>Home</button>
          <button class="tab" role="tab" data-action="tab" data-tab="activity" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>Activity</button>
          <div class="tab-add"><button class="fab" data-action="add" aria-label="Add expense">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
          <button class="tab" role="tab" data-action="tab" data-tab="budgets" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 4a8.5 8.5 0 1 0 9 9h-9V4z"/><path d="M14.5 2.5a7 7 0 0 1 7 7h-7v-7z"/></svg>Budgets</button>
          <button class="tab" role="tab" data-action="tab" data-tab="account" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Account</button>
        </nav>
      </div>

      <div class="backdrop" id="backdrop" data-action="close-sheet"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Transaction details" aria-hidden="true">
        <div class="sheet-head" id="sheet-head">
          <div class="grabber"></div>
          <button class="x-btn" data-action="close-sheet" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m2 2 8 8m0-8-8 8"/></svg></button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>

      <form class="modal" id="add" role="dialog" aria-modal="true" aria-labelledby="add-title" aria-hidden="true" novalidate>
        <div class="m-head" id="add-head">
          <div class="grabber"></div>
          <button type="button" class="m-cancel" data-action="close-add">Cancel</button>
          <h3 id="add-title">New expense</h3>
          <span></span>
        </div>
        <div class="m-body">
          <div class="amount-block" id="amount-block">
            <label class="amount-wrap" id="amount-wrap">
              <span class="cur">$</span>
              <input id="amount" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Amount" aria-describedby="amount-err">
              <span class="mirror" id="mirror" aria-hidden="true"></span>
            </label>
            <div class="amount-underline"></div>
            <div class="err" id="amount-err" role="alert"></div>
          </div>
          <div class="group-label">Category</div>
          <div class="cat-pick" id="cat-pick" role="radiogroup" aria-label="Category"></div>
          <div class="group-label">Details</div>
          <div class="list">
            <div class="field"><label for="date">Date</label><input id="date" type="date"></div>
            <div class="field"><label for="note">Note</label><input id="note" type="text" maxlength="60" placeholder="Optional" autocomplete="off"><span class="count" id="note-count"></span></div>
          </div>
          <div class="err" id="date-err" role="alert" style="justify-content:flex-start;padding-left:32px"></div>
        </div>
        <div class="m-foot"><button type="submit" class="primary">Add expense</button></div>
      </form>

      <div class="statusbar" id="statusbar">
        <span class="time">9:41</span>
        <div class="island"></div>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.6c2.2 0 4.2.8 5.7 2.2l1.2-1.2A9.8 9.8 0 0 0 8 .8 9.8 9.8 0 0 0 1.1 3.6l1.2 1.2A8.1 8.1 0 0 1 8 2.6zm0 3.5c1.3 0 2.5.5 3.4 1.3l1.2-1.2A6.6 6.6 0 0 0 8 4.3a6.6 6.6 0 0 0-4.6 1.9l1.2 1.2A4.9 4.9 0 0 1 8 6.1zm0 3.4c.5 0 .9.2 1.2.5L8 11.3 6.8 10c.3-.3.7-.5 1.2-.5z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".38"/><rect x="2" y="2" width="17" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
        </span>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const TODAY = '2026-11-06';
  const YESTERDAY = '2026-11-05';
  const MONTH = '2026-11';
  const MONTH_NAME = 'November';
  const DAYS_IN_MONTH = 30;
  const DAY_OF_MONTH = 6;

  const ICONS = {
    cart: '<circle cx="9" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/><path d="M2.5 3.5h2.6l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.3a1.6 1.6 0 0 0 1.6-1.2L21 7.5H6.2"/>',
    cup: '<path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9z"/><path d="M17 10.5h1.2a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/>',
    car: '<path d="M4.5 17H3v-3.6a3 3 0 0 1 .9-2.1L5 10.2l1.5-4a2 2 0 0 1 1.9-1.3h7.2a2 2 0 0 1 1.9 1.3l1.5 4 1.1 1.1a3 3 0 0 1 .9 2.1V17h-1.5M9.5 17h5M5 10.2h14"/><circle cx="7" cy="17" r="2.2"/><circle cx="17" cy="17" r="2.2"/>',
    bolt: '<path d="M13.2 2.5 4.8 13.4h6.7l-1 8.1 8.7-11h-6.9l.9-8z"/>',
    bag: '<path d="M5 8h14l-1.1 12.5H6.1L5 8z"/><path d="M9 10.5V7a3 3 0 0 1 6 0v3.5"/>',
    ticket: '<path d="M3 8.5V6.5a1.5 1.5 0 0 1 1.5-1.5h15A1.5 1.5 0 0 1 21 6.5v2a3.5 3.5 0 0 0 0 7v2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-2a3.5 3.5 0 0 0 0-7z"/><path d="M14.5 5.5v2M14.5 11v2M14.5 16.5v2"/>',
    heart: '<path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>',
    gift: '<rect x="3.5" y="8" width="17" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8S10.6 3.8 8.2 4.3C6.1 4.8 6.6 8 9 8h3zm0 0s1.4-4.2 3.8-3.7C17.9 4.8 17.4 8 15 8h-3z"/>'
  };
  const svg = (name, sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  const chev = '<svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 6 6-6 6"/></svg>';

  const CATS = [
    { id: 'groceries',     name: 'Groceries',     color: '#34C759', budget: 650, icon: 'cart' },
    { id: 'dining',        name: 'Dining',        color: '#FF9500', budget: 320, icon: 'cup' },
    { id: 'transport',     name: 'Transport',     color: '#0A84FF', budget: 260, icon: 'car' },
    { id: 'bills',         name: 'Bills',         color: '#5E5CE6', budget: 450, icon: 'bolt' },
    { id: 'shopping',      name: 'Shopping',      color: '#FF2D55', budget: 250, icon: 'bag' },
    { id: 'entertainment', name: 'Fun',           color: '#BF5AF2', budget: 120, icon: 'ticket' },
    { id: 'health',        name: 'Health',        color: '#FF453A', budget: 100, icon: 'heart' },
    { id: 'gifts',         name: 'Gifts',         color: '#00A5B8', budget: 250, icon: 'gift' }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const BUDGET = CATS.reduce((s, c) => s + c.budget, 0);

  const txns = [
    { id: 1,  merchant: 'Blue Bottle Coffee', cat: 'dining',        amount: 6.75,   date: '2026-11-06', time: '08:12', method: 'Apple Pay · Visa 4821', note: '' },
    { id: 2,  merchant: 'Whole Foods Market', cat: 'groceries',     amount: 84.32,  date: '2026-11-06', time: '07:41', method: 'Visa •••• 4821', note: 'Weekly shop, plus salmon for Sunday' },
    { id: 3,  merchant: 'Lyft',               cat: 'transport',     amount: 18.40,  date: '2026-11-05', time: '22:57', method: 'Apple Pay · Visa 4821', note: 'Ride home from Mission' },
    { id: 4,  merchant: 'Netflix',            cat: 'bills',         amount: 15.49,  date: '2026-11-05', time: '04:00', method: 'Amex •••• 1007', note: '' },
    { id: 5,  merchant: "Trader Joe's",       cat: 'groceries',     amount: 52.18,  date: '2026-11-04', time: '18:26', method: 'Visa •••• 4821', note: '' },
    { id: 6,  merchant: 'Sweetgreen',         cat: 'dining',        amount: 16.95,  date: '2026-11-04', time: '12:34', method: 'Apple Pay · Visa 4821', note: '' },
    { id: 7,  merchant: 'PG&E',               cat: 'bills',         amount: 112.60, date: '2026-11-03', time: '09:00', method: 'Autopay · Checking 3390', note: 'October gas and electric' },
    { id: 8,  merchant: 'Uniqlo',             cat: 'shopping',      amount: 79.90,  date: '2026-11-03', time: '17:48', method: 'Amex •••• 1007', note: 'Heattech layers and a fleece' },
    { id: 9,  merchant: 'Shell',              cat: 'transport',     amount: 48.21,  date: '2026-11-02', time: '08:05', method: 'Visa •••• 4821', note: '' },
    { id: 10, merchant: 'AMC Metreon 16',     cat: 'entertainment', amount: 31.00,  date: '2026-11-02', time: '19:10', method: 'Apple Pay · Visa 4821', note: 'Movie night with Sam' },
    { id: 11, merchant: 'Xfinity',            cat: 'bills',         amount: 79.99,  date: '2026-11-01', time: '06:00', method: 'Autopay · Checking 3390', note: 'Home internet' },
    { id: 12, merchant: 'CVS Pharmacy',       cat: 'health',        amount: 23.47,  date: '2026-11-01', time: '15:22', method: 'Visa •••• 4821', note: '' },
    { id: 13, merchant: 'Tartine Bakery',     cat: 'dining',        amount: 14.50,  date: '2026-11-01', time: '09:47', method: 'Apple Pay · Visa 4821', note: '' },
    { id: 14, merchant: 'Costco',             cat: 'groceries',     amount: 162.44, date: '2026-10-31', time: '11:15', method: 'Visa •••• 4821', note: 'Halloween party supplies' },
    { id: 15, merchant: 'Chipotle',           cat: 'dining',        amount: 13.85,  date: '2026-10-31', time: '13:02', method: 'Apple Pay · Visa 4821', note: '' },
    { id: 16, merchant: 'Spotify',            cat: 'bills',         amount: 11.99,  date: '2026-10-30', time: '03:00', method: 'Amex •••• 1007', note: '' },
    { id: 17, merchant: 'Clipper Card',       cat: 'transport',     amount: 20.00,  date: '2026-10-29', time: '08:31', method: 'Apple Pay · Visa 4821', note: '' },
    { id: 18, merchant: 'Target',             cat: 'shopping',      amount: 46.12,  date: '2026-10-28', time: '18:40', method: 'Visa •••• 4821', note: '' }
  ];
  let nextId = 100;
  const fresh = new Set();

  const state = { tab: 'home', pushCat: null, sheetTx: null, addOpen: false, addCat: 'groceries', query: '' };

  /* Formatting */
  const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const money = n => usd.format(n);
  const money0 = n => usd0.format(Math.round(n));
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const asDate = s => new Date(s + 'T12:00:00');
  const dayLabel = s => s === TODAY ? 'Today' : s === YESTERDAY ? 'Yesterday'
    : asDate(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  const longDate = s => asDate(s).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const time12 = t => { const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
  const titleOf = t => t.merchant || t.note || CAT[t.cat].name;

  /* Derived data */
  const sorted = list => [...list].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time) || b.id - a.id);
  const monthTx = () => txns.filter(t => t.date.startsWith(MONTH));
  const spentIn = cat => monthTx().filter(t => !cat || t.cat === cat).reduce((s, t) => s + t.amount, 0);
  const pct = (a, b) => Math.min(100, b ? (a / b) * 100 : 0);
  const barColor = (spent, budget, base) => spent > budget ? 'var(--danger)' : spent / budget >= .85 ? 'var(--warn)' : base;
  const ci = (c, size = '') => `<span class="ci ${size}" style="--c:${c.color}">${svg(c.icon)}</span>`;

  const txRow = (t, withDay) => {
    const c = CAT[t.cat];
    const when = withDay ? `${dayLabel(t.date)}` : time12(t.time);
    return `<button class="row" data-action="open-tx" data-id="${t.id}">
      ${ci(c, 'lg')}
      <span class="row-main">
        <span class="row-title" style="display:block">${esc(titleOf(t))}${fresh.has(t.id) ? '<span class="new-dot" aria-label="New"></span>' : ''}</span>
        <span class="row-sub" style="display:block">${c.name} · ${when}</span>
      </span>
      <span class="row-amt num">${money(t.amount)}</span>
    </button>`;
  };

  const groupedByDay = list => {
    const groups = [];
    for (const t of sorted(list)) {
      const g = groups[groups.length - 1];
      if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] });
    }
    return groups.map(g => `
      <div class="group-label"><span>${dayLabel(g.date)}</span><span class="num">${money(g.items.reduce((s, t) => s + t.amount, 0))}</span></div>
      <div class="list">${g.items.map(t => txRow(t, false)).join('')}</div>`).join('');
  };

  /* Views */
  function renderHome() {
    const spent = spentIn();
    const left = BUDGET - spent;
    const daysLeft = DAYS_IN_MONTH - DAY_OF_MONTH + 1;
    const pace = BUDGET * DAY_OF_MONTH / DAYS_IN_MONTH;
    const diff = spent - pace;
    const [d, c] = money(spent).split('.');
    const top = [...CATS].sort((a, b) => spentIn(b.id) - spentIn(a.id)).slice(0, 4);

    document.getElementById('home').innerHTML = `
      <div class="nav">
        <h1 class="large-title">${MONTH_NAME}</h1>
        <button class="avatar" data-action="tab" data-tab="account" aria-label="Account">MC</button>
      </div>
      <div class="hero">
        <div class="hero-top">
          <span class="eyebrow">Spent</span>
          <span class="pace ${diff > 0 ? 'over' : 'under'}">${money0(Math.abs(diff))} ${diff > 0 ? 'over' : 'under'} pace</span>
        </div>
        <div class="big num">${d}<small>.${c}</small></div>
        <div class="of num">of ${money0(BUDGET)} budget</div>
        <div class="meter" role="progressbar" aria-valuenow="${Math.round(pct(spent, BUDGET))}" aria-valuemin="0" aria-valuemax="100" aria-label="Budget used">
          <i style="width:${pct(spent, BUDGET)}%;background:${barColor(spent, BUDGET, 'var(--accent)')}"></i>
          <span class="marker" style="left:${(DAY_OF_MONTH / DAYS_IN_MONTH) * 100}%" title="Where spending should be today"></span>
        </div>
        <div class="hero-stats">
          <div><div class="stat-l">Left</div><div class="stat-v num">${money(left)}</div></div>
          <div><div class="stat-l">Per day · ${daysLeft} days</div><div class="stat-v num">${money(Math.max(0, left) / daysLeft)}</div></div>
        </div>
      </div>

      <div class="sec-h"><h2>Categories</h2><button class="link" data-action="tab" data-tab="budgets">See all</button></div>
      <div class="cat-grid">
        ${top.map(cat => {
          const s = spentIn(cat.id);
          return `<button class="tile" data-action="open-cat" data-cat="${cat.id}">
            <span class="tile-top">${ci(cat)}<span class="tile-name">${cat.name}</span></span>
            <span class="tile-amt num" style="display:block">${money(s)}</span>
            <span class="tile-of num">of ${money0(cat.budget)}</span>
            <span class="bar" style="display:block"><i style="width:${pct(s, cat.budget)}%;background:${barColor(s, cat.budget, cat.color)}"></i></span>
          </button>`;
        }).join('')}
      </div>

      <div class="sec-h"><h2>Recent</h2><button class="link" data-action="tab" data-tab="activity">See all</button></div>
      <div class="list">${sorted(txns).slice(0, 5).map(t => txRow(t, true)).join('')}</div>`;
  }

  function renderActivity() {
    const q = state.query.trim().toLowerCase();
    const list = q ? txns.filter(t => [titleOf(t), t.note, CAT[t.cat].name, t.merchant || ''].some(v => v.toLowerCase().includes(q))) : txns;
    document.getElementById('search').classList.toggle('has-text', !!state.query);
    document.getElementById('activity-list').innerHTML = list.length
      ? groupedByDay(list)
      : `<div class="empty-note">No results for “${esc(state.query.trim())}”</div>`;
  }

  function renderBudgets() {
    const spent = spentIn();
    document.getElementById('budgets').innerHTML = `
      <div class="nav"><h1 class="large-title">Budgets</h1></div>
      <div class="sum-card">
        <div class="sum-row"><span class="eyebrow">${MONTH_NAME}</span><span class="of num">${money0(BUDGET - spent)} left</span></div>
        <div class="sum-row" style="margin-top:6px"><b class="num">${money(spent)}</b><span class="of num">of ${money0(BUDGET)}</span></div>
        <div class="seg" aria-hidden="true">${CATS.map(c => { const s = spentIn(c.id); return s ? `<i style="width:${(s / BUDGET) * 100}%;background:${c.color}"></i>` : ''; }).join('')}</div>
      </div>
      <div class="group-label"><span>Categories</span></div>
      <div class="list">${CATS.map(c => {
        const s = spentIn(c.id);
        const count = monthTx().filter(t => t.cat === c.id).length;
        const left = c.budget - s;
        const cls = s > c.budget ? 'over' : s / c.budget >= .85 ? 'warn' : '';
        return `<button class="brow" data-action="open-cat" data-cat="${c.id}">
          ${ci(c, 'lg')}
          <span class="row-main">
            <span class="brow-line"><span class="brow-name">${c.name}</span><span class="brow-left num ${cls}">${left >= 0 ? money0(left) + ' left' : money0(-left) + ' over'}</span></span>
            <span class="bar" style="display:block"><i style="width:${pct(s, c.budget)}%;background:${barColor(s, c.budget, c.color)}"></i></span>
            <span class="brow-sub num" style="display:block">${count ? `${money(s)} of ${money0(c.budget)} · ${count} ${count === 1 ? 'expense' : 'expenses'}` : `No expenses yet · ${money0(c.budget)} budget`}</span>
          </span>
          ${chev}
        </button>`;
      }).join('')}</div>`;
  }

  function renderPush() {
    const push = document.getElementById('push');
    if (!state.pushCat) return;
    const c = CAT[state.pushCat];
    const list = monthTx().filter(t => t.cat === c.id);
    const s = spentIn(c.id);
    push.innerHTML = `
      <div class="backbar"><button class="back" data-action="back">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Budgets</button></div>
      <div class="cat-head">${ci(c, 'lg')}<h1 class="large-title">${c.name}</h1></div>
      <div class="sum-card">
        <div class="sum-row"><b class="num">${money(s)}</b><span class="of num">of ${money0(c.budget)}</span></div>
        <div class="meter" style="margin-bottom:10px"><i style="width:${pct(s, c.budget)}%;background:${barColor(s, c.budget, c.color)}"></i></div>
        <div class="sum-row"><span class="of num">${c.budget - s >= 0 ? money(c.budget - s) + ' left this month' : money(s - c.budget) + ' over budget'}</span></div>
      </div>
      ${list.length ? groupedByDay(list) : `
        <div class="group-label"><span>${MONTH_NAME}</span></div>
        <div class="empty-card">
          ${ci(c, 'xl')}
          <div class="empty-title">No expenses in ${c.name} yet</div>
          <button class="pill-btn" data-action="add" data-cat="${c.id}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add expense</button>
        </div>`}`;
  }

  function renderAccount() {
    const sw = (id, on, label) => `<div class="srow"><span class="k" id="${id}-l">${label}</span><button class="switch" role="switch" aria-checked="${on}" aria-labelledby="${id}-l" data-action="toggle"></button></div>`;
    const nav = (k, v) => `<button class="srow"><span class="k">${k}</span><span class="v num">${v}</span>${chev}</button>`;
    document.getElementById('account').innerHTML = `
      <div class="nav"><h1 class="large-title">Account</h1></div>
      <div class="profile"><span class="avatar">MC</span><div><div class="p-name">Maya Chen</div><div class="p-mail">maya.chen@icloud.com</div></div></div>
      <div class="group-label"><span>Budget</span></div>
      <div class="list">${nav('Monthly budget', money0(BUDGET))}${nav('Month starts on', 'The 1st')}${nav('Currency', 'USD')}</div>
      <div class="group-label"><span>Notifications</span></div>
      <div class="list">${sw('n1', true, 'Category near limit')}${sw('n2', false, 'Daily summary')}${sw('n3', true, 'Large expenses')}</div>
      <div class="group-label"><span>Privacy</span></div>
      <div class="list">${sw('p1', true, 'Require Face ID')}${nav('Export data', 'CSV')}</div>`;
  }

  function render() {
    renderHome();
    renderActivity();
    renderBudgets();
    renderPush();
    if (state.sheetTx) renderSheet();
  }

  /* Tabs and navigation */
  function setTab(tab) {
    if (tab === state.tab) {
      const pane = document.getElementById('pane-' + tab);
      if (tab === 'budgets' && state.pushCat) { closePush(); return; }
      pane.querySelectorAll('.scroll, .push').forEach(el => el.scrollTo({ top: 0, behavior: 'smooth' }));
      return;
    }
    state.tab = tab;
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab));
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  }

  function openPush(cat) {
    state.pushCat = cat;
    renderPush();
    const push = document.getElementById('push');
    push.scrollTop = 0;
    if (state.tab !== 'budgets') {
      push.style.transition = 'none';
      document.getElementById('pane-budgets').querySelector('.scroll').style.transition = 'none';
      setTab('budgets');
    }
    push.classList.add('open');
    push.setAttribute('aria-hidden', 'false');
    document.getElementById('pane-budgets').classList.add('pushed');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      push.style.transition = '';
      document.getElementById('pane-budgets').querySelector('.scroll').style.transition = '';
    }));
  }
  function closePush() {
    const push = document.getElementById('push');
    push.classList.remove('open');
    push.setAttribute('aria-hidden', 'true');
    document.getElementById('pane-budgets').classList.remove('pushed');
    state.pushCat = null;
  }

  /* Transaction sheet */
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  let lastFocus = null;

  function renderSheet() {
    const t = txns.find(x => x.id === state.sheetTx);
    if (!t) return;
    const c = CAT[t.cat];
    const s = spentIn(c.id);
    const inMonth = t.date.startsWith(MONTH);
    const showNote = t.note && t.note !== titleOf(t);
    document.getElementById('sheet-body').innerHTML = `
      <div class="d-hero">
        ${ci(c, 'xl')}
        <div class="d-title">${esc(titleOf(t))}</div>
        <div class="d-amt num">${money(t.amount)}</div>
        <div class="d-when">${dayLabel(t.date)}, ${time12(t.time)}</div>
      </div>
      <div class="group-label"><span>Details</span></div>
      <div class="list">
        <div class="kv"><span class="k">Category</span><span class="v"><span class="dot" style="--c:${c.color}"></span>${c.name}</span></div>
        <div class="kv"><span class="k">Date</span><span class="v">${longDate(t.date)}</span></div>
        <div class="kv"><span class="k">Paid with</span><span class="v">${esc(t.method)}</span></div>
        ${showNote ? `<div class="kv note"><span class="k">Note</span><span class="v">${esc(t.note)}</span></div>` : ''}
      </div>
      ${inMonth ? `
      <div class="group-label"><span>${c.name} in ${MONTH_NAME}</span></div>
      <div class="list ctx">
        <div class="ctx-line num"><span>${money(s)} spent</span><span>of ${money0(c.budget)}</span></div>
        <div class="bar"><i style="width:${pct(s, c.budget)}%;background:${barColor(s, c.budget, c.color)}"></i></div>
      </div>` : ''}`;
  }

  function openSheet(id) {
    lastFocus = document.activeElement;
    state.sheetTx = id;
    renderSheet();
    document.getElementById('sheet-body').scrollTop = 0;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    backdrop.classList.add('show');
    setTimeout(() => sheet.querySelector('.x-btn').focus({ preventScroll: true }), 50);
  }
  function closeSheet() {
    if (!state.sheetTx) return;
    state.sheetTx = null;
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    backdrop.classList.remove('show');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  /* Add expense */
  const addEl = document.getElementById('add');
  const amount = document.getElementById('amount');
  const mirror = document.getElementById('mirror');
  const amountBlock = document.getElementById('amount-block');
  const amountErr = document.getElementById('amount-err');
  const dateInput = document.getElementById('date');
  const dateErr = document.getElementById('date-err');
  const note = document.getElementById('note');
  const noteCount = document.getElementById('note-count');
  const app = document.getElementById('app');
  const statusbar = document.getElementById('statusbar');
  dateInput.max = TODAY;

  const errIcon = '<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 7v6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.4" fill="#fff"/></svg>';

  function renderPicker() {
    document.getElementById('cat-pick').innerHTML = CATS.map(c => `
      <button type="button" class="pick" role="radio" aria-checked="${c.id === state.addCat}" data-action="pick" data-cat="${c.id}">
        <span class="ci" style="--c:${c.color}">${svg(c.icon)}</span>${c.name}
      </button>`).join('');
  }
  function sizeAmount() {
    mirror.textContent = amount.value || amount.placeholder;
    amount.style.width = Math.ceil(mirror.getBoundingClientRect().width / currentScale) + 4 + 'px';
  }
  function setAmountError(msg) {
    amountBlock.classList.toggle('invalid', !!msg);
    amountErr.innerHTML = msg ? errIcon + msg : '';
    amount.setAttribute('aria-invalid', String(!!msg));
  }
  function setDateError(msg) {
    dateErr.classList.toggle('on', !!msg);
    dateErr.innerHTML = msg ? errIcon + msg : '';
  }

  function openAdd(cat) {
    closeSheet();
    lastFocus = document.activeElement;
    state.addOpen = true;
    state.addCat = cat || 'groceries';
    amount.value = '';
    note.value = '';
    noteCount.textContent = '';
    dateInput.value = TODAY;
    setAmountError('');
    setDateError('');
    renderPicker();
    addEl.querySelector('.m-body').scrollTop = 0;
    addEl.classList.add('open');
    addEl.setAttribute('aria-hidden', 'false');
    app.classList.add('recessed');
    statusbar.classList.add('light');
    requestAnimationFrame(sizeAmount);
    setTimeout(() => amount.focus({ preventScroll: true }), 380);
  }
  function closeAdd() {
    if (!state.addOpen) return;
    state.addOpen = false;
    addEl.classList.remove('open');
    addEl.setAttribute('aria-hidden', 'true');
    app.classList.remove('recessed');
    statusbar.classList.remove('light');
    if (document.activeElement && addEl.contains(document.activeElement)) document.activeElement.blur();
  }

  amount.addEventListener('input', () => {
    let v = amount.value.replace(/[^\d.]/g, '');
    const dot = v.indexOf('.');
    if (dot > -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, '').slice(0, 2);
    if (v.startsWith('.')) v = '0' + v;
    v = v.replace(/^0+(?=\d)/, '');
    const [whole, frac] = v.split('.');
    if (whole.length > 6) v = whole.slice(0, 6) + (frac !== undefined ? '.' + frac : '');
    amount.value = v;
    sizeAmount();
    if (amountBlock.classList.contains('invalid') && parseFloat(v) > 0) setAmountError('');
  });
  note.addEventListener('input', () => {
    const n = note.value.length;
    noteCount.textContent = n > 40 ? `${60 - n}` : '';
  });
  dateInput.addEventListener('input', () => { if (dateInput.value) setDateError(''); });

  function shake(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  addEl.addEventListener('submit', e => {
    e.preventDefault();
    const raw = amount.value;
    const value = parseFloat(raw);
    let ok = true;
    if (!raw) { setAmountError('Enter an amount'); ok = false; }
    else if (!(value > 0)) { setAmountError('Amount must be more than $0'); ok = false; }
    if (!dateInput.value) { setDateError('Choose a date'); ok = false; }
    else if (dateInput.value > TODAY) { setDateError('Date can’t be in the future'); ok = false; }
    if (!ok) {
      if (amountBlock.classList.contains('invalid')) { shake(document.getElementById('amount-wrap')); amount.focus(); }
      else dateInput.focus();
      return;
    }
    const now = new Date();
    const t = {
      id: nextId++,
      merchant: null,
      cat: state.addCat,
      amount: Math.round(value * 100) / 100,
      date: dateInput.value,
      time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
      method: 'Added manually',
      note: note.value.trim()
    };
    txns.push(t);
    fresh.add(t.id);
    closeAdd();
    render();
    toast(`${money(t.amount)} added to ${CAT[t.cat].name}`);
  });

  /* Toast */
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.innerHTML = `<span class="ok"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 6.3 2.3 2.2 4.7-5"/></svg></span>${esc(msg)}`;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* Drag to dismiss */
  function draggable(panel, handle, onClose) {
    let y0 = null, dy = 0, t0 = 0;
    handle.addEventListener('pointerdown', e => {
      if (e.target.closest('button, input')) return;
      y0 = e.clientY; dy = 0; t0 = performance.now();
      panel.style.transition = 'none';
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', e => {
      if (y0 === null) return;
      const raw = (e.clientY - y0) / currentScale;
      dy = raw > 0 ? raw : raw / 6;
      panel.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 === null) return;
      const v = dy / Math.max(1, performance.now() - t0);
      y0 = null;
      panel.style.transition = '';
      panel.style.transform = '';
      if (dy > 120 || (v > .5 && dy > 30)) onClose();
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }
  draggable(sheet, document.getElementById('sheet-head'), closeSheet);
  draggable(addEl, document.getElementById('add-head'), closeAdd);

  /* Events */
  document.getElementById('screen').addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const { action } = el.dataset;
    if (action === 'tab') setTab(el.dataset.tab);
    else if (action === 'open-tx') openSheet(Number(el.dataset.id));
    else if (action === 'close-sheet') closeSheet();
    else if (action === 'open-cat') openPush(el.dataset.cat);
    else if (action === 'back') closePush();
    else if (action === 'add') openAdd(el.dataset.cat || (state.tab === 'budgets' && state.pushCat) || undefined);
    else if (action === 'close-add') closeAdd();
    else if (action === 'pick') {
      state.addCat = el.dataset.cat;
      document.querySelectorAll('.pick').forEach(p => p.setAttribute('aria-checked', String(p === el)));
    }
    else if (action === 'toggle') el.setAttribute('aria-checked', String(el.getAttribute('aria-checked') !== 'true'));
    else if (action === 'clear-search') { const q = document.getElementById('q'); q.value = ''; state.query = ''; renderActivity(); q.focus(); }
  });
  document.getElementById('q').addEventListener('input', e => { state.query = e.target.value; renderActivity(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (state.addOpen) closeAdd();
    else if (state.sheetTx) closeSheet();
    else if (state.pushCat && state.tab === 'budgets') closePush();
  });

  /* Fit the device to the window */
  let currentScale = 1;
  function fit() {
    currentScale = Math.min(1, (window.innerHeight - 32) / 868, (window.innerWidth - 32) / 414);
    document.getElementById('stage').style.transform = `scale(${currentScale})`;
  }
  window.addEventListener('resize', fit);
  fit();

  renderAccount();
  render();
})();
</script>
</body>
</html>
