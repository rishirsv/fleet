web_search = "live"

# Selected defaults; mirror them in T3's environment settings.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
# UI text size uses app defaults.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Codex settings rebuilt from explicit user choices.
# pstack/Drafts source selection is managed by scripts/plugin-sync/.
# Image generation uses the available image_gen tool and imagegen skill.

[features]
api_key_model_discovery = true

[agents]
max_concurrent_threads_per_session = 8

[apps._default]
enabled = true
default_tools_approval_mode = "approve"
destructive_enabled = true
open_world_enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."build-ios-apps@openai-curated-remote"]
enabled = true

[desktop]
git-branch-prefix = ""
git-create-pull-request-as-draft = false
worktree-upstream-refresh-mode = "best-effort"
worktree-auto-cleanup-enabled = true
worktree-keep-count = 15
git-pull-request-merge-method = "squash"
show-educational-tips = false
codeFontSize = 16
reviewDelivery = "detached"
show-context-window-usage = true
preventSleepWhileRunning = true
followUpQueueMode = "queue"
defaultTerminalLocation = "right"
appearanceTheme = "system"
appearanceDarkCodeThemeId = "vercel"

[desktop.appearanceLightChromeTheme.fonts]
code = '"Paper Mono", ui-monospace, "SFMono-Regular"'

[desktop.appearanceDarkChromeTheme]
accent = "#006efe"
accentSource = "custom"
contrast = 50
ink = "#ededed"
opaqueWindows = true
surface = "#000000"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Geist Mono", ui-monospace, "SFMono-Regular"'
ui = "Geist, Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#00AD3A"
diffRemoved = "#F13342"
skill = "#9540D5"
