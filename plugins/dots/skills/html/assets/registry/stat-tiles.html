<!-- component: stat-tiles
title: Stat tiles
type: ui
when: 2-5 headline numbers the reader needs to see immediately — counts,
  deltas, budgets, scores. Put them right after the dek; they summarize the
  document's key measures.
deps: theme.css
variants: 4-up (default, collapses 2x2 on narrow) | 3-up | 2-up (set
  grid-template-columns accordingly).
gotchas: Values are figures, not sentences — keep them under ~8 characters and
  put the description in the label. tabular-nums is on the value. A third quieter
  line (.kpi-note) is allowed for a source or comparison; never a chip. Every
  number must be real and traceable — no fake KPIs.
-->
<style>
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--a8);
    border: 1px solid var(--a12);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    margin-bottom: var(--section);
  }
  .kpi-grid:has(> :last-child:nth-child(2)) { grid-template-columns: repeat(2, 1fr); }
  .kpi-grid:has(> :last-child:nth-child(3)) { grid-template-columns: repeat(3, 1fr); }
  .kpi-grid:has(> :last-child:nth-child(5)) { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 620px) {
    .kpi-grid:has(> :last-child:nth-child(n)) { grid-template-columns: repeat(2, 1fr); }
    .kpi-grid:has(> :last-child:nth-child(odd)) > :last-child { grid-column: span 2; }
  }
  .kpi-tile { padding: 20px 20px 18px; background: var(--surface); min-width: 0; }
  .kpi-value {
    font-family: var(--font-display);
    font-size: 30px; line-height: 1.1; font-weight: 640;
    letter-spacing: calc(-0.9px * var(--display-tracking));
    font-variant-numeric: tabular-nums; margin-bottom: 8px;
  }
  .kpi-label { font-size: 13px; font-weight: 500; color: var(--a70); line-height: 1.45; }
  .kpi-note { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  @media (max-width: 620px) {
    .kpi-tile { padding: 16px; }
    .kpi-value { font-size: 26px; }
  }
</style>

<div data-component="stat-tiles" class="kpi-grid">
  <div class="kpi-tile">
    <div class="kpi-value">14</div>
    <div class="kpi-label">PRs merged</div>
    <div class="kpi-note">+3 vs last week</div>
  </div>
  <div class="kpi-tile">
    <div class="kpi-value">6</div>
    <div class="kpi-label">deploys</div>
  </div>
  <div class="kpi-tile">
    <div class="kpi-value">1</div>
    <div class="kpi-label">incident</div>
    <div class="kpi-note">SEV-2 · 47m</div>
  </div>
  <div class="kpi-tile">
    <div class="kpi-value">99.1%</div>
    <div class="kpi-label">suite pass rate</div>
  </div>
</div>
